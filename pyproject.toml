[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "carcassonne-ai"
version = "0.1.0"
description = "AlphaZero-style Carcassonne AI + position analyzer for family games."
authors = [{ name = "Joshua Ishal" }]
requires-python = ">=3.12"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
