# WORKERS.conf — the ONE place per-box worker counts and run constants live for
# the FPU DOSE-LADDER round (measurement/fpu_ladder_prep/).
#
# Sourced at the top of run_cells.sh:  . "$(dirname "$0")/WORKERS.conf"
#
# TO CHANGE A CONSTANT, EDIT HERE AND NOTHING ELSE. No launcher hard-codes a value.
# ⛔ THE PAIR IS LAW — every constant below is read from DESIGN.md / READ_RULE.md;
# a launcher that disagrees with the pair is a LAUNCHER defect, and the pair does
# not move.
#
# ⚠️ THE BARS, THE RUNGS AND THE BANDS ARE NOT HERE. They live in ONE
# implementation — screen_lib.py — imported by BOTH the adjudicator and this
# launcher's precondition ladder, so they cannot drift apart.
# tests/test_fpu_ladder_instrument.py asserts this file agrees with screen_lib.

# --- the blind commit every read-out is gated against (READ_RULE.md §4) --------
# ⛔ A commit cannot name its own hash from inside itself, so this stays PENDING
# at the freeze commit; a small FOLLOW-UP commit stamps the real 40-hex sha
# before any real launch. --dry-run and the §9 smoke are EXEMPT (they spend no
# blindness and no band).
BLIND_COMMIT=PENDING

# --- the bands (DESIGN.md §5) --------------------------------------------------
# ⛔ PROPOSED, NOT CLAIMED. run_cells.sh refuses a real rung until the sibling
# BAND_CLAIMED file exists, which the ORCHESTRATOR drops only after re-running
# the tree sweep and appending governance/BAND_REGISTRY.csv — FOUR rows.
# ⚠️⚠️ 146000000000 IS A TRAP: absent from the registry but carrying references
# in the tree. The registry is necessary and NOT sufficient — the TREE SWEEP is
# the binding check and is re-run immediately before the CSV append.
# ⚠️ 161e9 is CLAIMED by S1 G3 and 162e9 / 163e9 are RESERVED by it (commit
# 8b187c71). This ladder therefore starts at 164e9, not at the next free id.
# ⚠️ These are RESTATED here for the launcher's log line only; screen_lib.BANDS
# is the law and run_cells.sh asserts the two agree.
BAND_FPU005=164000000000
BAND_FPU010=165000000000
BAND_FPU015=166000000000
BAND_FPU030=167000000000
THROWAWAY_BASE=167999999000

# --- per-box workers ----------------------------------------------------------
# ⚠️ W IS THROUGHPUT-ONLY. Games are bit-identical at any W and NO gate in this
# pair reads a clock. W moves wall clock and the rung->box assignment, and no
# bar, no gate and no branch.
# ⭐⭐ W_LOCAL=14 IS THE OWNER'S RULING OF 2026-08-30 (interactive-use
# constraint; commit 56cabcbf dropped it 30 -> 14 for the S1 G3 round).
# ⛔ DO NOT RAISE IT WITHOUT THE OWNER. DESIGN §6 prices what it costs: at
# W_LOCAL=30 the round's wall would be ~9.8 h instead of ~14.2 h, and that is an
# OWNER decision about his own desktop, not a measurement decision.
W_LOCAL=14
W_LAPTOP=22

# --- budget, BOTH sides (DESIGN.md §2.4) --------------------------------------
# ⭐⭐ The 2026-08-30 promoted DESKTOP champion (k16 x 1376 = 22016). Both sides
# of every rung run the CURRENT champion.
# ⛔ run_cells.sh RE-ASSERTS this against governance/PRODUCTION.yaml at launch
# (G-PROD) rather than trusting this restatement: a frozen budget that has
# silently drifted from the champion is a rung measuring a dose against a stale
# opponent, and every other gate would pass it.
K_DETS=16
SIMS_PER_DET=1376
TOTAL_SIMS=22016
EXACT_K=2
EXACT_MODE=marginalized
BACKEND=rust

# --- the tie arbiter: OFF, BOTH SIDES (DESIGN.md §2.3) ------------------------
# ⚠️⚠️ THIS IS A DEVIATION FROM THE DEPLOYED CHAMPION. PRODUCTION.yaml has
# carried B=64 since 2026-08-20. It is off here because the arbiter is a
# STOCHASTIC post-search root hook: leaving it on would add fire-driven variance
# on BOTH sides, orthogonal to the dose under test, for no gain — and it fires
# on exact ties, which is exactly what a changed visit distribution moves. The
# price — that every reading is about the ARBITER-FREE champion — rides on every
# branch, and step 2 of the adoption chain is the leg that prices it.
# ⛔ There is NO --cand-tiearb-* flag anywhere in run_cells.sh, by construction.

# --- rules ---------------------------------------------------------------------
# ⚠️ R9 is env-latched at IMPORT. Exported by run_cells.sh before python starts.
RULES_PROFILE=fixed_v1
CARCASSONNE_FIX_R9=1

# --- paths ---------------------------------------------------------------------
# ⚠️ THE SHARE MOUNT PATH DIFFERS BY BOX: local uses /mnt/c/carc-shared, anything
# inside an `ssh laptop` uses /mnt/carc-shared. run_cells.sh resolves it from the
# ROLE, never from a hard-coded string.
SHARE_LOCAL=/mnt/c/carc-shared
SHARE_LAPTOP=/mnt/carc-shared
OUT_TAG=fpu_ladder

# --- the §9 smoke ---------------------------------------------------------------
# Per box, at that box's OWN frozen W, on the throwaway sub-range, PRODUCTION
# KNOBS, only the game count reduced. ⛔ The smoke emits NO OUTCOME KEY.
# ⭐ Its one substantive job beyond liveness: it exercises the REAL argparse and
# returns the RESOLVED DOSE as the harness actually wrote it (the PG-D7..D9
# lesson — a smoke adjudicated against anything but the EMITTED output proves
# nothing about the launcher).
# ⭐⭐ THE LOCAL BOX SMOKES 0.05 AND THE LAPTOP SMOKES 0.30 — the two EXTREME
# doses of the ladder, and each box smokes a dose it will actually run. 0.05 is
# the load-bearing one: it is the dose a dose-blind build would be hardest to
# distinguish from the champion.
SMOKE_GAMES=8
SMOKE_DOSE_LOCAL=0.05
SMOKE_DOSE_LAPTOP=0.30
