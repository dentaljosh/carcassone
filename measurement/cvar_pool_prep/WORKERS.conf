# WORKERS.conf — the ONE place per-box worker counts and run constants live for
# the GT-M1 RISK-ASYMMETRIC WORLD POOLING screen (measurement/cvar_pool_prep/).
#
# Sourced at the top of run_cells.sh:  . "$(dirname "$0")/WORKERS.conf"
#
# TO CHANGE A CONSTANT, EDIT HERE AND NOTHING ELSE. No launcher hard-codes a value.
# ⛔ THE PAIR IS LAW — every constant below is read from PREREG.md; a launcher
# that disagrees with the pair is a LAUNCHER defect, and the pair does not move.
#
# ⚠️ THE BAR, THE CELLS, THE BANDS AND THE GATES ARE NOT DECIDED HERE. They live
# in ONE implementation — cvar_lib.py — imported by BOTH the adjudicator and this
# launcher's precondition ladder, so they cannot drift apart.
# tests/test_cvar_pool.py asserts this file agrees with cvar_lib.
#
# ⚠️⚠️ NO TRAILING COMMENTS ON ASSIGNMENT LINES. This file is sourced by bash AND
# parsed by the test; a `KEY=value  # note` line has bitten this program three
# times (the third was 2026-09-01, commit 981ca55a). Comments go on their own
# lines, above the assignment.

# --- the blind commit every read-out is gated against --------------------------
# ⛔ A commit cannot name its own hash from inside itself, so this stays PENDING
# at the freeze commit; a small FOLLOW-UP commit stamps the real 40-hex sha
# before any real launch. --dry-run, --plan and the smoke are EXEMPT (they spend
# no blindness and no band).
BLIND_COMMIT=PENDING

# --- the bands (PREREG §3) -----------------------------------------------------
# ⛔ PROPOSED, NOT CLAIMED. run_cells.sh refuses a real chunk until the sibling
# BAND_CLAIMED file exists, which the ORCHESTRATOR drops only after re-running
# the tree sweep and appending governance/BAND_REGISTRY.csv — TWO rows.
# ⚠️ 174e9 (synth mechanism-corroboration) is the highest id in the registry at
# this freeze, so 175/176e9 are the next monotone free ids. THE CLAIMING AGENT
# RE-RUNS THE SWEEP: this round's two predecessors both had to REASSIGN their
# proposed bands because another round took them between freeze and claim
# (fpu_swap took 170e9 from the tau_p placeholder; the 44k rung took 173e9 from
# synth-mech). Treat these two numbers as proposals, not reservations.
BAND_CVAR25=175000000000
BAND_CVAR50=176000000000
THROWAWAY_BASE=175999999000

# --- the cells -----------------------------------------------------------------
# 400 seat-balanced decks x 2 seatings = 800 games per cell, deck-PAIRED.
N_DECKS=400
N_GAMES=800

# --- ⭐⭐ THE SINGLE VARIABLE ---------------------------------------------------
# ⛔ CANDIDATE SIDE ONLY, via --cand-pool-mode / --cand-pool-alpha. There is NO
# shared --pool-mode flag ANYWHERE in the harness, by design: a two-sided pooling
# change is a different CHAMPION, not a cell. And there is NO --cand-c-puct, NO
# --cand-tau-p and NO --cand-fpu-reduction in run_cells.sh — a second live knob
# would make this a confounded cell claiming one variable (G-SINGLEVAR).
#
# The two doses are read straight off the census's reach curve
# (cl083_mech_censuses_20260830/READOUT.md §1): 0.25 is the curve's MAXIMUM
# (reach 0.340, the census's own primary) and 0.50 is the interior point
# (0.271). 0.75 was rejected because its marginal risk-aversion contribution
# (0.080) is below the census's own 0.10 kill bar.
POOL_MODE=cvar
ALPHA_LOW=0.25
ALPHA_HIGH=0.50

# --- per-box workers ------------------------------------------------------------
# ⚠️ W IS THROUGHPUT-ONLY. Games are bit-identical at any W and NO gate in this
# pair reads a clock. W moves wall clock and nothing else — no bar, no gate, no
# branch.
#
# ⭐ W_LAPTOP=22 is the owner's standing laptop setting since 2026-09-01 (~22:40
# EDT, verbatim "change it at tau8. carcasum is taking 30s a turn") — the laptop
# keeps two threads for his pinned-playout Carcasum server, which was STILL
# RUNNING at this round's freeze (verified in the pre-launch census). Unlike the
# tau_p leg's W=24 this is a MEASURED operating point: the 2026-08-31 arb-on
# laptop sweep priced W22 at 129.0 g/h at this exact cell shape.
W_LAPTOP=22

# --- realized throughput, for the ETA arithmetic ONLY ---------------------------
# ⛔ NO GATE READS A CLOCK. A planning constant and nothing else.
G_PER_H_LAPTOP=129

# --- budget, BOTH sides (PREREG §3) ---------------------------------------------
# ⭐⭐ The 2026-08-30 promoted DESKTOP champion (k16 x 1376 = 22016). Both sides
# of every cell run the CURRENT champion.
# ⛔ run_cells.sh RE-ASSERTS this against governance/PRODUCTION.yaml at launch
# (G-PROD) rather than trusting this restatement.
# ⚠️⚠️ K_DETS IS LOAD-BEARING FOR THIS ROUND IN A WAY IT WAS NOT FOR ITS
# PREDECESSORS: alpha is a FRACTION of k, so alpha=0.25 here averages the worst
# 4 of 16 where the census averaged the worst 2 of 8. A cell at a different width
# is running a different RULE, not merely a different budget.
K_DETS=16
SIMS_PER_DET=1376
TOTAL_SIMS=22016
EXACT_K=2
EXACT_MODE=marginalized
BACKEND=rust

# --- ⭐⭐ THE TIE ARBITER: ARMED, BOTH SEATS, AT THE DEPLOYED SPEC ---------------
# ⛔ run_cells.sh RE-ASSERTS these against governance/PRODUCTION.yaml at launch.
# ⚠️ PRODUCTION.yaml carries NO phase_gate key, because the deployed arbiter is
# UNGATED — and "all" is exactly how the harness spells ungated. G-PROD checks
# the knobs the YAML states and asserts the ABSENCE of a gate reads "all" here,
# rather than letting an argparse default decide it.
# ⚠️⚠️ THE ARBITER AND THE POOLING RULE COMPOSE: pimc_move computes the pooled
# pick FIRST and hands it to the arbiter as champ_pick, so on a CVaR candidate
# the arbiter arbitrates ties around the CVaR pick. That is the DEPLOYED agent
# plus one rule — the right estimand for an adoption decision — but the two
# surfaces are not independently attributable inside this cell (PREREG §9.6).
TIEARB_B=64
TIEARB_J=4
TIEARB_MODE=argmax
TIEARB_SALT=tiearb2-deploy-v1
TIEARB_EPS=0.0
TIEARB_PHASE_GATE=all

# --- rules ----------------------------------------------------------------------
# ⚠️ R9 is env-latched at IMPORT. Exported by run_cells.sh before python starts.
RULES_PROFILE=fixed_v1
CARCASSONNE_FIX_R9=1

# --- paths ----------------------------------------------------------------------
# ⚠️⚠️ THE SHARE MOUNT PATH DIFFERS BY BOX. This round runs on the LAPTOP only,
# so /mnt/carc-shared is the one that matters; the local path is recorded for a
# reader who pools the records on the local box for analysis.
SHARE_LAPTOP=/mnt/carc-shared
SHARE_LOCAL=/mnt/c/carc-shared
OUT_TAG=cvar_pool

# --- the smoke ------------------------------------------------------------------
# Per box, at that box's OWN frozen W, on the throwaway sub-range, PRODUCTION
# KNOBS (arbiter ARMED on BOTH seats, the rule on the candidate), only the game
# count reduced. ⛔ The smoke emits NO OUTCOME KEY.
# ⭐ Its substantive jobs: drive the REAL argparse and return the RESOLVED
# POOLING RULE FOR BOTH SEATS as the harness actually wrote it, AND — new to this
# round — witness a nonzero `pool_pickchanges` in real production-budget play
# before a band is spent. 8 games at ~140 plies each is overwhelmingly likely to
# reach at a per-ply rate of 0.02 or better; the smoke adjudicator FAILS if it
# does not.
SMOKE_GAMES=8
