# ALLOCATION.conf — the ONE place the static (box x judge x chunk) allocation
# lives for tiearb2_20260816. Sourced by run_main.sh AFTER WORKERS.conf.
#
# ⚠️ TO REBALANCE, EDIT THE THREE ALLOC_* LINES HERE AND NOTHING ELSE.
# No launcher hard-codes a chunk list; no script surgery is required. (Same
# discipline as WORKERS.conf, which owns the worker counts.)
#
# --- WHY STATIC --------------------------------------------------------------
# `scripts/tiletie/run_tiletie.py` has NO `--shared-claim` and no cross-box work
# stealing — only `--resume`. So the two boxes cannot steal from one queue and
# the split has to be decided up front.
#
# --- THE ARITHMETIC (measured inputs, DESIGN §11 + the realized corpus plan) --
#   corpus (FINAL, post-§0.A.2 digest exclusions):
#                           1,350 positions / 724 roots, mean_arms 3.0022,
#                           total_arm_playouts 172,992  (= 128.1 playouts/position)
#   clair-puct (rust, walled) : 172,992 x 1.60 s  =  76.9 worker-h
#   tier1-greedy (python)     : 172,992 x ~2.5 s  = 120.1 worker-h
#   pool                      : W_LOCAL 30 + W_LAPTOP 22 = 52 workers
#                               => ideal makespan 197.6 / 52 = 3.8 h
#
#   LOCAL  (W30): clair-puct chunks 1-4  (~2.6 h)  THEN tier1-greedy chunk 4 (~1.0 h)  => ~3.6 h
#   LAPTOP (W22): tier1-greedy chunks 1-3 (~4.1 h)
#   => makespan ~4.1 h.
#
#   (The earlier "local=clair, laptop=tier1, all 4 chunks each" split was balanced
#    at W_LOCAL=14. At W_LOCAL=30 it is not — it costs ~5.5 h.)
#
# ⚠️ THE ALLOCATION ASSUMES c_tier1 ~ 2.5 and c_clair ~ 1.60 worker-s/playout.
#    THE PILOT RE-MEASURES c_tier1. If the pilot's c_tier1 differs from 2.5 by
#    more than ~25% (i.e. outside [1.88, 3.13]), REVISIT THIS FILE BEFORE LAUNCH.
#    Nothing about the READ is affected — the allocation is throughput only and
#    cannot move a value. Chunk MEMBERSHIP is fixed by POSITION_ORDER.json and is
#    identical for both judges regardless of who runs which chunk.

# --- the chunk cut -----------------------------------------------------------
N_CHUNKS=4

# --- (box, judge) -> chunk list ---------------------------------------------
ALLOC_local_clair_puct="1 2 3 4"
ALLOC_local_tier1_greedy="4"
# ⚠️ CORRECTION: the laptop DOES have the rust wheel — `carc_rs` imports fine there
# (verified 2026-08-16; the earlier "no carc_core" probe was the WRONG MODULE NAME).
# The laptop is given no clair-puct work for LOAD-BALANCE reasons only, not
# capability: at W30/W22 the makespan-optimal split puts ~69% of the tier1-greedy
# worker-hours on the laptop, which consumes all of it. If you rebalance, the
# laptop CAN take clair-puct chunks.
ALLOC_laptop_side_clair_puct=""
ALLOC_laptop_side_tier1_greedy="1 2 3"

# --- the cost assumptions this allocation was sized against ------------------
C_CLAIR_ASSUMED=1.60      # worker-s per playout, rust backend, `walled`
C_TIER1_ASSUMED=2.5       # worker-s per playout, python backend
C_TIER1_REVISIT_TOLERANCE=0.25
