# WORKERS.conf — the ONE place per-box worker counts and run constants live for
# the τ_p AUDIT LEG (measurement/taup_audit_leg_20260901/).
#
# Sourced at the top of run_cells.sh:  . "$(dirname "$0")/WORKERS.conf"
#
# TO CHANGE A CONSTANT, EDIT HERE AND NOTHING ELSE. No launcher hard-codes a value.
# ⛔ THE PAIR IS LAW — every constant below is read from PREREG.md; a launcher
# that disagrees with the pair is a LAUNCHER defect, and the pair does not move.
#
# ⚠️ THE BAR, THE CELLS, THE BANDS, THE DOSES AND THE GATES ARE NOT DECIDED HERE.
# They live in ONE implementation — leg_lib.py — imported by run_cells.sh's
# precondition ladder, adjudicate_smoke.py AND test_taup_leg.py, so they cannot
# drift apart. test_taup_leg.py asserts this file agrees with leg_lib.

# --- the blind commit every read-out is gated against (PREREG.md §8) ----------
# ⛔ A commit cannot name its own hash from inside itself, so this stays PENDING
# at the freeze commit; a small FOLLOW-UP commit stamps the real 40-hex sha
# before any real launch. --dry-run, --plan and the smoke are EXEMPT (they spend
# no blindness and no band). run_cells.sh REFUSES a real cell while PENDING.
BLIND_COMMIT=c573fbf0ef71fc4bd8d3e1820ac6d2a64ce1f159

# --- the bands (PREREG.md §7) --------------------------------------------------
# ⛔⛔ PROPOSED, NOT CLAIMED. run_cells.sh refuses a real cell until the sibling
# BAND_CLAIMED file exists, which the ORCHESTRATOR drops only after re-running
# the tree sweep and appending governance/BAND_REGISTRY.csv — TWO rows, one per
# cell. ⚠️ THE REGISTRY IS NECESSARY AND NOT SUFFICIENT: the TREE SWEEP is the
# binding check (146e9 is the standing trap — absent from the registry but
# carrying references in the tree) and must be re-run immediately before the
# append. 169e9 was spent by fpu_h2h round 2 on 2026-08-31; these are the next
# two monotone free ids AS OF THE FREEZE, and the orchestrator re-derives them.
BAND_TAU3=171000000000  # reassigned at claim: 170e9 was claimed by fpu_swap_cell same day
BAND_TAU8=172000000000  # reassigned at claim (see above)
THROWAWAY_BASE=171999999000

# --- ⭐⭐ THE TWO DOSES — the single variable, one per cell ---------------------
# ⛔ CANDIDATE SIDE ONLY, via --cand-tau-p. There is NO bare --tau-p and NO
# --c-puct / --cand-c-puct / --cand-fpu-reduction anywhere in run_cells.sh: the
# bare pair are the SHARED flags (they build champ_cfg_dict, which _make_opponent
# feeds through the SAME _cfg_from_dict) so they move BOTH SIDES, and the other
# two candidate knobs would make this cell confounded.
# ⚠️ BOTH DOSES SIT INSIDE T3's MEASURED-SAFE INTERVAL [3.0, 8.0]; see PREREG §4.
TAU_DOSE_LOW=3.0
TAU_DOSE_HIGH=8.0
TAU_P_PRODUCTION=5.0

# --- per-box workers ------------------------------------------------------------
# ⚠️ W IS THROUGHPUT-ONLY. Games are bit-identical at any W and NO gate in this
# pair reads a clock. W moves wall clock and nothing else — no bar, no gate, no
# branch.
# ⭐ W_LAPTOP=22  # 24→22 for CELL_TAU8 (owner 2026-09-01: Carcasum E-5 moves hit 30 s/turn at W24); CELL_TAU3 ran at 24 — result-safe, DEVIATIONS D-6 per the OWNER THREADS RULING 2026-09-01 ("w* = logical threads
# … 32 and 24"). ⚠️ DISCLOSED: the 2026-08-31 arb-on laptop sweep
# (measurement/wsweep_laptop_20260831) measured {18,22,26,28,30} and NO W=24
# point exists at this cell shape; 24 is the owner's rule, not a measured settle,
# and it sits between the measured W22 (129.0 g/h) and W26 (135.4 g/h). This
# resolves no bar either way.
W_LAPTOP=24

# --- realized throughput, for the ETA arithmetic ONLY ---------------------------
# ⛔ NO GATE READS A CLOCK. Planning constants and nothing else. The BRACKET is
# quoted rather than a point because no W=24 rate has been measured and the house
# rule forbids interpolating a new operating point out of two measured ones.
# Source: measurement/wsweep_laptop_20260831/READOUT.md (paired estimator, same
# cell shape) + the realized c1-c3 steady state of fpu_h2h round 2 (129.4 g/h).
G_PER_H_LAPTOP_LO=129
G_PER_H_LAPTOP_HI=135

# --- budget, BOTH sides (PREREG.md §3) -----------------------------------------
# ⭐⭐ The 2026-08-30 promoted DESKTOP champion (k16 x 1376 = 22016). Both sides
# of both cells run the CURRENT champion.
# ⛔ run_cells.sh RE-ASSERTS this against governance/PRODUCTION.yaml at launch
# (G-PROD) rather than trusting this restatement.
K_DETS=16
SIMS_PER_DET=1376
TOTAL_SIMS=22016
EXACT_K=2
EXACT_MODE=marginalized
BACKEND=rust

# --- ⭐⭐ THE TIE ARBITER: ARMED, BOTH SEATS, AT THE DEPLOYED SPEC ---------------
# Verbatim from measurement/fpu_h2h_r2_prep/WORKERS.conf — this leg runs the
# DEPLOYED config on both seats, and the deployed arbiter is part of it.
# ⚠️ PRODUCTION.yaml carries NO phase_gate key because the deployed arbiter is
# UNGATED — "all" is exactly how the harness spells ungated.
TIEARB_B=64
TIEARB_J=4
TIEARB_MODE=argmax
TIEARB_SALT=tiearb2-deploy-v1
TIEARB_EPS=0.0
TIEARB_PHASE_GATE=all

# --- rules ----------------------------------------------------------------------
# ⚠️ R9 is env-latched at IMPORT. Exported by run_cells.sh before python starts.
# ⚠️ WITHOUT --rules-profile the harness runs `walled` (argparse's DEFAULT_PROFILE),
# NOT the fixed_v1 this pair freezes — the PG-D8 defect.
RULES_PROFILE=fixed_v1
CARCASSONNE_FIX_R9=1

# --- the cell shape -------------------------------------------------------------
# 400 DECKS x 2 SEATINGS = 800 games per cell, deck-PAIRED and seat-balanced.
# ⛔ WITHOUT --paired THERE IS NO PRIMARY (the PG-D9 defect): _build_work returns
# n DISTINCT decks at ONE seat each, no deck appears in both seatings, n_paired=0,
# and the cell ALSO walks 2*n_decks seeds — outside its own frozen band.
N_DECKS=400
N_GAMES=800

# --- paths ----------------------------------------------------------------------
# ⚠️⚠️ THIS LEG RUNS ON THE LAPTOP. Anything inside an `ssh laptop*` uses
# /mnt/carc-shared; local would use /mnt/c/carc-shared. Only the laptop path is
# defined here because only the laptop is funded to play — a second box would
# need its own smoke, its own throwaway offset and a chunking scheme this leg
# deliberately does not have.
SHARE_LAPTOP=/mnt/carc-shared
OUT_TAG=taup_audit_leg

# --- the smoke ------------------------------------------------------------------
# Per cell, at the laptop's OWN frozen W, on the throwaway sub-range, PRODUCTION
# KNOBS (arbiter ARMED on BOTH seats, dose on the candidate), only the game count
# reduced. ⛔ The smoke emits NO OUTCOME KEY, and adjudicate_smoke.py exits
# NONZERO on an empty or manifest-less cell.
SMOKE_GAMES=8
