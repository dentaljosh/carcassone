# WORKERS.conf — the ONE place per-box worker counts and run constants live for
# the PHASE-GATED TIE ARBITRATION round (measurement/phasegate_prep/).
#
# Sourced at the top of run_cells.sh:  . "$(dirname "$0")/WORKERS.conf"
#
# TO CHANGE A CONSTANT, EDIT HERE AND NOTHING ELSE. No launcher hard-codes a value.
# ⛔ THE PAIR IS LAW — every constant below is read from DESIGN.md / READ_RULE.md;
# a launcher that disagrees with the pair is a LAUNCHER defect, and the pair does
# not move.
#
# ⚠️ THE BARS ARE NOT HERE. Every bar, window, branch condition and cell shape
# lives in ONE implementation — screen_lib.py — imported by BOTH the adjudicator
# and this launcher's precondition ladder, so they cannot drift apart.
# tests/test_phasegate_instrument.py asserts BAND == screen_lib.BAND.

# --- the blind commit every read-out is gated against (READ_RULE.md §4) --------
# ⛔ A commit cannot name its own hash from inside itself, so this stays PENDING
# at the freeze commit; a small FOLLOW-UP commit stamps the real 40-hex sha
# before any real launch. --dry-run and the §9 smoke are EXEMPT (they spend no
# blindness and no band).
BLIND_COMMIT=PENDING

# --- the band (DESIGN.md §5) ---------------------------------------------------
# ⛔ PROPOSED, NOT CLAIMED. run_cells.sh refuses a real cell until the sibling
# BAND_CLAIMED file exists, which the ORCHESTRATOR drops only after re-running
# the tree sweep and appending governance/BAND_REGISTRY.csv.
# ⚠️ 146000000000 IS A TRAP: absent from the registry but carrying 20 references
# in the tree. The registry is necessary and NOT sufficient — the TREE SWEEP is
# the binding check and is re-run immediately before the CSV append.
BAND=154000000000
THROWAWAY_BASE=154999999000

# --- per-box workers ----------------------------------------------------------
# ⚠️ W IS THROUGHPUT-ONLY. Games are bit-identical at any W and NO gate in this
# pair reads a clock (READ_RULE.md header). W moves wall clock and the cell->box
# assignment, and no bar, no gate and no branch.
# ⭐ The realized fleet asymmetry is 1.45:1 in LOCAL's favour at these nominal
# counts (SIZING_ETA.md §4) — that, not the nominal W, drives the assignment.
# ⭐ OWNER OVERRIDE 2026-08-28 (Shabbos envelope, verbatim "we should default to
# w22 laptop w30 local"): W_LOCAL=30, not the design-time 14. W is throughput-only
# — no gate in the pair reads a clock — so this moves wall clock and the realized
# box speed ratio, and NO bar, gate or branch. DESIGN §6.4/§6.5's 1.45:1 ratio and
# its 13.5 h wall were computed at W14 and are correspondingly conservative.
W_LOCAL=30
W_LAPTOP=22

# --- budget, both sides (DESIGN.md §2.4) --------------------------------------
K_DETS=8
SIMS_PER_DET=1376
EXACT_K=2
EXACT_MODE=marginalized
BACKEND=rust

# --- the arbiter, CANDIDATE ONLY (DESIGN.md §2.3/§2.4) ------------------------
# ⚠️⚠️ THIS IS NOT THE PRODUCTION RUNG. PRODUCTION.yaml has carried B=64 since
# 2026-08-20. B=16 is chosen so the ANCHOR reproduces the Stage-2 contrast
# EXACTLY; the price — that the answer is about the B=16 arbiter and its
# transfer to the deployed B=64 one is an ASSUMPTION, not a measurement — rides
# on every branch.
ARB_B=16
ARB_J=4
ARB_MODE=argmax
ARB_SALT=tiearb2-deploy-v1
ARB_EPS=0.0

# --- rules ---------------------------------------------------------------------
# ⚠️ R9 is env-latched at IMPORT. Exported by run_cells.sh before python starts.
RULES_PROFILE=fixed_v1
CARCASSONNE_FIX_R9=1

# --- paths ---------------------------------------------------------------------
# ⚠️ THE SHARE MOUNT PATH DIFFERS BY BOX: local uses /mnt/c/carc-shared, anything
# inside an `ssh laptop` uses /mnt/carc-shared. run_cells.sh resolves it from the
# ROLE, never from a hard-coded string.
SHARE_LOCAL=/mnt/c/carc-shared
SHARE_LAPTOP=/mnt/carc-shared
OUT_TAG=phasegate_a1

# --- the §9 smoke ---------------------------------------------------------------
# Per box, at that box's OWN frozen W, on the throwaway band, PRODUCTION KNOBS,
# only the game count reduced. ⛔ The smoke emits NO OUTCOME KEY.
SMOKE_GAMES=22
