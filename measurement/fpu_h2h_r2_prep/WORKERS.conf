# WORKERS.conf — the ONE place per-box worker counts and run constants live for
# the FPU PRODUCTION-H2H ROUND 2 (measurement/fpu_h2h_r2_prep/).
#
# Sourced at the top of run_cells.sh:  . "$(dirname "$0")/WORKERS.conf"
#
# TO CHANGE A CONSTANT, EDIT HERE AND NOTHING ELSE. No launcher hard-codes a value.
# ⛔ THE PAIR IS LAW — every constant below is read from DESIGN.md / READ_RULE.md;
# a launcher that disagrees with the pair is a LAUNCHER defect, and the pair does
# not move.
#
# ⚠️ THE BAR, THE CELL, THE BAND, THE CHUNKING AND THE ARBITER SPEC ARE NOT
# DECIDED HERE. They live in ONE implementation — screen_lib.py — imported by
# BOTH the adjudicator and this launcher's precondition ladder, so they cannot
# drift apart. tests/test_fpu_h2h_r2_instrument.py asserts this file agrees with
# screen_lib.

# --- the blind commit every read-out is gated against (READ_RULE.md §4) --------
# ⛔ A commit cannot name its own hash from inside itself, so this stays PENDING
# at the freeze commit; a small FOLLOW-UP commit stamps the real 40-hex sha
# before any real launch. --dry-run, --plan and the §9 smoke are EXEMPT (they
# spend no blindness and no band).
BLIND_COMMIT=PENDING

# --- the band (DESIGN.md §5) ---------------------------------------------------
# ⛔ PROPOSED, NOT CLAIMED. run_cells.sh refuses a real chunk until the sibling
# BAND_CLAIMED file exists, which the ORCHESTRATOR drops only after re-running
# the tree sweep and appending governance/BAND_REGISTRY.csv — ONE row.
# ⚠️⚠️ 146000000000 IS A TRAP: absent from the registry but carrying references
# in the tree. The registry is necessary and NOT sufficient — the TREE SWEEP is
# the binding check and is re-run immediately before the CSV append.
# ⚠️ 161e9 is CLAIMED by S1 G3 and 162e9 / 163e9 are RESERVED by it; 164e9-167e9
# were SPENT by the dose ladder and 168e9 by ROUND 1 of this H2H, all on
# 2026-08-31. This round starts at 169e9, the next monotone free id.
# ⚠️ RESTATED here for the launcher's log line only; screen_lib.BAND is the law
# and run_cells.sh asserts the two agree.
BAND_H2H=169000000000
THROWAWAY_BASE=169999999000

# --- ⭐⭐ THE CHUNKING (DESIGN.md §6.3) -----------------------------------------
# 800 decks = 8 CHUNKS x 100 decks (200 games each). ⛔ THE CHUNK IS THE UNIT OF
# BOX ASSIGNMENT AND THE UNIT OF PROVENANCE, and it exists because of the
# FLEXIBLE-BOX CLAUSE (DESIGN §6.4):
#   * every chunk is its own out-dir, so every chunk emits its OWN manifest.json
#     (host, code_rev, wheel sha, the resolved config for BOTH seats) and its OWN
#     summary.json. eval_fair_puct writes the manifest at run START and the
#     summary at run END, so a chunk KILLED mid-flight has a manifest and no
#     summary — the adjudicator treats a summary-less chunk as ABSENT/FAIL and
#     the fix is to RESUME that chunk (its per-game records are already on disk
#     and are cached-skipped), never to read around it;
#   * a box change can therefore only happen at a CHUNK BOUNDARY, which is what
#     makes "which box played which range" an exactly answerable question;
#   * G-NODUP asserts the realized chunk ranges are pairwise DISJOINT and that
#     every (deck, seat) appears exactly ONCE across the pooled records.
N_CHUNKS=8
DECKS_PER_CHUNK=100

# --- per-box workers ------------------------------------------------------------
# ⚠️ W IS THROUGHPUT-ONLY. Games are bit-identical at any W and NO gate in this
# pair reads a clock. W moves wall clock and nothing else — no bar, no gate, no
# branch. ⭐ THAT IS ALSO WHY THE BOX ASSIGNMENT IS FREE TO MOVE MID-ROUND
# (DESIGN §6.4): nothing downstream reads it as anything but provenance.
#
# ⭐ W_LAPTOP=26 is BANKED from the 2026-08-31 arb-on laptop sweep
# (wsweep_laptop_20260831: plateau 26-30, W22 -4.7% z-36; smallest-on-plateau per
# the house rule intent, disagreement disclosed in that READOUT).
W_LAPTOP=26
#
# ⛔⛔ W_LOCAL IS DELIBERATELY UNSET. No arb-on LOCAL sweep exists at this commit
# (measurement/wsweep_local_20260831/READOUT.md was absent when this instrument
# was frozen). run_cells.sh REFUSES --role local for EVERY mode — including
# --dry-run and --smoke — while this reads TBD_FROM_SWEEP. ⭐ THE LAPTOP IS
# UNAFFECTED and launches now; local joins only once this is a positive integer.
# ⚠️ This is the SAME refusal round 1 used for W_LAPTOP, for the same reason: a
# smoke at a W the box will not run is a smoke of a different tenancy, and the
# ETA the orchestrator reports must be derived from the W actually used.
# Replace the token with a positive integer — nothing else in this file or in the
# pair moves with it.
W_LOCAL=TBD_FROM_SWEEP

# --- realized throughput, for the ETA arithmetic ONLY (DESIGN §6) ---------------
# ⛔ NO GATE READS A CLOCK. These are planning constants and nothing else.
# ⭐ G_PER_H_LAPTOP is round 1's OWN realized rate at W=26 with the arbiter armed
# on both seats — the only arb-on throughput measurement this program owns, and
# an exact match to this round's configuration.
G_PER_H_LAPTOP=135
# ⚠️ ESTIMATE ONLY, and it is NOT a licence to launch: local cannot join until
# W_LOCAL is stamped. Scaled from the dose ladder's arb-off cross-box ratio
# (local T_game 487.9 s vs laptop 502.4 s) at the same 1.345x arb-on multiplier.
G_PER_H_LOCAL_ESTIMATE=165

# --- budget, BOTH sides (DESIGN.md §2) ------------------------------------------
# ⭐⭐ The 2026-08-30 promoted DESKTOP champion (k16 x 1376 = 22016). Both sides
# of the cell run the CURRENT champion.
# ⛔ run_cells.sh RE-ASSERTS this against governance/PRODUCTION.yaml at launch
# (G-PROD) rather than trusting this restatement: a frozen budget that has
# silently drifted from the champion is a cell measuring a knob against a stale
# opponent, and every other gate would pass it.
K_DETS=16
SIMS_PER_DET=1376
TOTAL_SIMS=22016
EXACT_K=2
EXACT_MODE=marginalized
BACKEND=rust

# --- the single variable --------------------------------------------------------
# ⛔ CANDIDATE SIDE ONLY, via --cand-fpu-reduction. There is NO --cand-c-puct and
# NO bare --c-puct / --tau-p anywhere in run_cells.sh: those two are the SHARED
# flags (they build champ_cfg_dict, which _make_opponent feeds through the SAME
# _cfg_from_dict), so they move BOTH SIDES and a cell built on one is
# champion-vs-champion.
FPU_DOSE=0.2

# --- ⭐⭐ THE TIE ARBITER: ARMED, BOTH SEATS, AT THE DEPLOYED SPEC ---------------
# ⚠️⚠️ governance/PRODUCTION.yaml has carried B=64 since 2026-08-20. Round 1 of
# this H2H is the only fpu cell that has ever run with it ARMED ON BOTH SEATS,
# and this round is its successor at 2x the n.
# ⛔ run_cells.sh RE-ASSERTS these against governance/PRODUCTION.yaml at launch.
# ⚠️ PRODUCTION.yaml carries NO phase_gate key, because the deployed arbiter is
# UNGATED — and "all" is exactly how the harness spells ungated. G-PROD checks
# the six knobs the YAML states and asserts the absence of a gate reads "all"
# here, rather than letting an argparse default decide it.
TIEARB_B=64
TIEARB_J=4
TIEARB_MODE=argmax
TIEARB_SALT=tiearb2-deploy-v1
TIEARB_EPS=0.0
TIEARB_PHASE_GATE=all

# --- rules ----------------------------------------------------------------------
# ⚠️ R9 is env-latched at IMPORT. Exported by run_cells.sh before python starts.
RULES_PROFILE=fixed_v1
CARCASSONNE_FIX_R9=1

# --- paths ----------------------------------------------------------------------
# ⚠️⚠️ THE SHARE MOUNT PATH DIFFERS BY BOX and BOTH are defined here, because
# THIS ROUND MAY RUN ON BOTH BOXES (DESIGN §6.4). Anything inside an
# `ssh laptop` uses /mnt/carc-shared; local uses /mnt/c/carc-shared. They are the
# SAME shared storage, which is what lets the two boxes' chunk dirs sit side by
# side under ONE out-root and be pooled by ONE read.
SHARE_LAPTOP=/mnt/carc-shared
SHARE_LOCAL=/mnt/c/carc-shared
OUT_TAG=fpu_h2h_r2

# --- the §9.2 smoke -------------------------------------------------------------
# Per box, at that box's OWN frozen W, on the throwaway sub-range, PRODUCTION
# KNOBS (arbiter ARMED on BOTH seats, dose on the candidate), only the game count
# reduced. ⛔ The smoke emits NO OUTCOME KEY.
# ⭐ Its substantive jobs: drive the REAL argparse and return the RESOLVED DOSE
# and the RESOLVED ARBITER DICT FOR BOTH SEATS as the harness actually wrote them
# (the PG-D7..D9 lesson, plus the 2026-08-31 one).
# ⛔⛔ EACH BOX SMOKES SEPARATELY, on its OWN throwaway offset, before it plays a
# single chunk. Local's smoke is what proves local can express the cell — its
# fpu and --opp-tiearb-* plumbing are PYTHON-ONLY and a stale bundle there would
# serve a dose-free candidate and/or an unarmed opponent with a healthy wheel.
SMOKE_GAMES=8

# --- ⭐⭐ the §9.3 IDENT legs ---------------------------------------------------
# THE TWO PROPOSITIONS NO BANKED CERTIFICATE COVERS:
#   IDENT-REPRODUCES  two runs of the SAME arb-on-both-seats config on the SAME
#                     seeds produce identical outcomes (the arbiter is a
#                     STOCHASTIC root hook driven by a CRN salt);
#   POSITIVE-ARB-ON   dropping the dose at the same seeds, arbiter still live,
#                     CHANGES PLAY. ⛔ FPU_BITEXACT_LADDER's positive controls
#                     are at 0.05/0.1/0.15/0.3 and ALL of them are ARBITER-OFF,
#                     so this is the 0.2-with-the-arbiter-live control that has
#                     never existed on any wheel.
# ⚠️ THEY RUN AT THE GOLDEN GATE'S OWN TINY BUDGET (k2 x 96), deliberately: the
# proposition is about a CODE PATH, not a budget, and fpu_reduction is read on
# EVERY unvisited-child PUCT score. ⛔ NO NUMBER IN THEM IS A STRENGTH
# MEASUREMENT.
# ⚠️ IDENT_GAMES=2 is the funded shape and it is the ONE leg with a false-alarm
# mode: two shallow searches CAN coincide. If POSITIVE-ARB-ON fails, RAISE THIS
# and re-smoke before concluding the wiring is broken — and do not launch either
# way until it passes.
IDENT_GAMES=2
IDENT_K_DETS=2
IDENT_SIMS=96
