# WORKERS_G3.conf — the ONE place per-box worker counts and run constants live
# for S1 GATE G3 (the three-arm decomposition cell).
#
# Sourced at the top of run_g3.sh:  . "$(dirname "$0")/WORKERS_G3.conf"
#
# TO CHANGE A CONSTANT, EDIT HERE AND NOTHING ELSE. No launcher hard-codes a value.
# ⛔ THE PAIR IS LAW — every constant below is read from DESIGN.md §6.4 /
# READ_RULE_G3.md; a launcher that disagrees with the pair is a LAUNCHER defect,
# and the pair does not move.
#
# ⚠️ THE BARS, THE CELLS AND THE BAND ARE NOT HERE. They live in ONE
# implementation — screen_lib_g3.py — imported by BOTH the adjudicator and this
# launcher's precondition ladder, so they cannot drift apart.
# tests/test_s1_g3_instrument.py asserts this file agrees with screen_lib_g3.

# --- the blind commit every read-out is gated against (READ_RULE_G3 §7) --------
# ⛔ A commit cannot name its own hash from inside itself, so this stays PENDING
# at the freeze commit; a small FOLLOW-UP commit stamps the real 40-hex sha
# before any real launch. --dry-run and the smoke are EXEMPT (they spend no
# blindness and no band).
BLIND_COMMIT=5c59967229ab4f5ba94d951cdecea2c131e07f74

# --- the band (READ_RULE_G3 §2.3, BAND_CLAIM_G3.json) --------------------------
# ⛔ PROPOSED, NOT CLAIMED. run_g3.sh refuses a real cell until the sibling
# BAND_CLAIMED_G3 file exists, which the ORCHESTRATOR drops only after re-running
# the tree sweep and appending governance/BAND_REGISTRY.csv.
# ⚠️⚠️ 146000000000 IS A TRAP: absent from the registry but carrying references
# in the tree. 158e9 and 160e9 are the same shape (0 registry rows, live tree
# hits) and are DROPPED. 155/156/157e9 belong to the FPU-RESURRECTION round.
# ⭐ ONE band, not three: DESIGN §6.4 and SIZING §6 require ONE SHARED DECK SET
# across the three arms (CRN — P2 is a cross-arm contrast and needs it).
BAND_G3=161000000000
THROWAWAY_BASE=161999999000

# --- per-box workers ----------------------------------------------------------
# ⚠️ W IS THROUGHPUT-ONLY. Games are bit-identical at any W and NO gate in this
# pair reads a clock EXCEPT the N4 ms_ratio rider, which is a WITHIN-CELL ratio
# of the two sides on the same box and is therefore W-invariant.
# ⭐ The owner's standing defaults (2026-08-28, verbatim "we should default to
# w22 laptop w30 local"), restated in this brief.
# W_LOCAL=14 per OWNER 2026-08-30 (verbatim: "whatever is set to run on local next, set it to w14" — interactive-use constraint, the 08-27 precedent). W is THROUGHPUT-ONLY: no gate reads a clock; wall-clock and cell->box economics move, nothing else. Frozen for the whole round — never 30-then-14.
W_LOCAL=30  # 14->30 MID-ROUND 2026-08-30 ~18:50, owner: "everything can upgrade to w30" (left office). Throughput-only; clean kill+resume; DEVIATIONS_G3 G3-D2.
W_LAPTOP=22

# --- budget, BOTH sides (DESIGN.md §6.4) --------------------------------------
# ⭐⭐ The DESKTOP champion moved 11008 -> 22016 (k16 x 1376) on 2026-08-30.
# Both sides of every arm run the CURRENT champion.
# ⛔ run_g3.sh RE-ASSERTS this against governance/PRODUCTION.yaml at launch
# (G-PROD) rather than trusting this restatement.
K_DETS=16
SIMS_PER_DET=1376
TOTAL_SIMS=22016
EXACT_K=2
EXACT_MODE=marginalized
BACKEND=rust

# --- THE SINGLE VARIABLE (DESIGN §6.4, G1_VERDICT.md d* = 0.25) ---------------
# ⭐ dose and mask are IDENTICAL across all three arms. SCOPE is the only mover.
# Dose 0.25 is d* from G1 — the SMALLEST OBSERVABLE dose, NOT "the right dose"
# (READ_RULE_G1 §6.5, carried).
JR_DOSE=0.25
JR_MASK=31

# --- the tie arbiter: OFF, BOTH SIDES (DESIGN.md §6.4) ------------------------
# ⚠️⚠️ THIS IS A DELIBERATE DEVIATION FROM THE DEPLOYED CHAMPION (PRODUCTION.yaml
# has carried tiearb B=64 since 2026-08-20). Three reasons, from DESIGN §6.4:
# (1) it is the precedent the champion's OWN budget promotion was measured under
# (h2h_22016_20260824); (2) the arbiter overrides the search's pick at exactly
# the plies where it fires, DILUTING a search intervention; (3) cost.
# ⛔ DEPLOY TRANSFER IS THEREFORE AN ASSUMPTION and rides on every branch.
# ⛔ There is NO --cand-tiearb-* flag anywhere in run_g3.sh, by construction.

# --- rules ---------------------------------------------------------------------
# ⚠️ R9 is env-latched at IMPORT. Exported by run_g3.sh before python starts.
RULES_PROFILE=fixed_v1
CARCASSONNE_FIX_R9=1

# --- paths ---------------------------------------------------------------------
# ⚠️ THE SHARE MOUNT PATH DIFFERS BY BOX: local uses /mnt/c/carc-shared, anything
# inside an `ssh laptop` uses /mnt/carc-shared. run_g3.sh resolves it from the
# ROLE, never from a hard-coded string.
SHARE_LOCAL=/mnt/c/carc-shared
SHARE_LAPTOP=/mnt/carc-shared
OUT_TAG=s1_g3

# --- the smoke -----------------------------------------------------------------
# Per box, at that box's OWN frozen W, on the throwaway sub-range, PRODUCTION
# KNOBS, only the game count reduced. ⛔ The smoke emits NO OUTCOME KEY.
# ⭐ Its one substantive job beyond liveness: it exercises the REAL argparse and
# returns the RESOLVED SCOPE as the harness actually wrote it, PLUS the play-
# derived G-WITNESS census — the PG-D7..D9 lesson plus the R7 witness that G1's
# verdict made a pre-launch condition.
# ⭐ EVERY SCOPE THIS BOX WILL RUN IS SMOKED: local smokes opp AND all, the
# laptop smokes own. A scope that was never smoked is a scope never proven to
# bind, and "it is the same code path" is exactly the argument that produced the
# FPU round.
SMOKE_GAMES=8
