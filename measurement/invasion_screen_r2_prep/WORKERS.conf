# WORKERS.conf -- the ONE place per-box worker counts and run constants live for the
# INVASION-RISK TERM FAMILY ROUND-2 BRACKET (measurement/invasion_screen_r2_prep/).
#
# Sourced at the top of run_cells.sh:  . "$(dirname "$0")/WORKERS.conf"
#
# TO CHANGE A CONSTANT, EDIT HERE AND NOTHING ELSE. No launcher hard-codes a value.
# THE PAIR IS LAW -- every constant below is read from DESIGN.md / READ_RULE.md; a
# launcher that disagrees with the pair is a launcher defect, the pair does not move.
#
# ⚠️ THE BARS ARE NOT HERE. Every bar, threshold and cost figure lives in ONE
# implementation, screen_lib.py, imported by BOTH the adjudicator and this launcher's
# precondition ladder -- so the launcher's in-flight per-cell pre-check and the
# adjudicator's own G-LEAF cannot drift apart. This file carries only the run's
# OPERATIONAL constants (W, RAM floors, timeouts, paths) plus the band, and
# tests/test_invasion_screen_r2_instrument.py asserts BAND == screen_lib.BAND.

# --- the blind commit every read-out must be gated against (READ_RULE.md SS3) ---
# A commit cannot name its own hash from inside itself -- stays PENDING at the freeze
# commit; a small FOLLOW-UP commit stamps the real sha before any real launch.
# HEALTHY -> a 40-hex commit sha (also written to the sibling BLIND_COMMIT file).
# FIRES (refuses a real launch) -> the literal string PENDING.
# --dry-run and the SS9 smoke are EXEMPT (they spend no blindness, no band).
BLIND_COMMIT=c60669486115a7e9c8246f43ec774e5c3da60257

# --- source-revision pin (the d1-rebase G-REV machinery, ported) ----------------
# The 40-hex sha the WHOLE ROUND must run at, in the sibling file PINNED_SRC_REV.
# Re-asserted BEFORE and AFTER every pass of every cell; a moved HEAD or a dirty
# src/engine/scripts/rust/tests ABORTS rather than producing a mixed-rev archive.
#
# ⭐ IT IS THE ORCHESTRATOR'S LAUNCH ACT, and the one step that cannot be done inside
# the freeze ceremony: it must equal `git rev-parse HEAD` EXACTLY at launch, and a
# commit cannot contain its own sha, so it is written UNCOMMITTED on the launch box,
# immediately before `chmod +x run_cells.sh`:
#
#     git -C /home/doctor/projects/carcassone rev-parse HEAD \
#       > /home/doctor/projects/carcassone/measurement/invasion_screen_r2_prep/PINNED_SRC_REV
#
# SAFE: measurement/ is DELIBERATELY EXCLUDED from the clean-source check (CODE_PATHS
# is src/ engine/ scripts/ rust/ tests/ pyproject.toml setup.py ONLY), so writing it
# does not dirty the source tree and does not trip the launcher's own gate.
# BLIND_COMMIT is the OPPOSITE: committed, and must be an ANCESTOR of HEAD.
PINNED_SRC_REV_FILE=PINNED_SRC_REV
SRC_CLEAN_LOG=SRC_CLEAN.jsonl
BAND_SENTINEL=BAND_CLAIMED

# --- ⭐ TWO BOXES (DESIGN.md SS6.5) --------------------------------------------
# Owner directive, verbatim: "get round 2 on both local and laptop".
#
# ⛔ THE CELL->BOX ASSIGNMENT IS FROZEN IN screen_lib.py (CellSpec.box), NOT HERE, and
# G-HOST enforces it against the emitted manifest. run_cells.sh takes --host local|laptop
# and runs EXACTLY that box's cells, refusing any other. WHOLE CELLS PER BOX: a cell's
# records are never split across machines.
#
# ⭐ EVERY PRE-REGISTERED CONTRAST IS WITHIN ONE BOX. Shapes are assigned whole -- A and
# B (four cells) local, C (three cells) laptop -- so SS4.5's low-vs-high contrast and
# SS4.7's noise-signature check are all within-box. That is what lets the round avoid
# relying on cross-box float identity, which this program HAS been bitten by (the Xeon
# was RE-RETIRED 2026-08-02 because AVX-512 makes the G0 determinism check FAIL).
#
# ⚠️ W IS THROUGHPUT-ONLY on either box. Games are BIT-IDENTICAL at any W
# (rust/carc/carc-core/src/fair/mod.rs:22-32 -- the determinization merge is a sequential
# fold after every join). No statistic, gate or claim moves with W.
#
# W_LOCAL=22  is the settled F7d value for this workload class and what round 1 ran.
# W_LAPTOP=22 is h2h_22016_prep's W_LAPTOP -- the closest precedent by workload class (a
#             rust eval_fair_puct head-to-head with BOTH sides converted), where it was
#             sized DOWN from W26 against the laptop's 11 GB ceiling.
#             ⚠️ NOT the W=14 of the carcasum pairs: those run a JVM opponent process per
#             game and are a different memory shape entirely.
W_LOCAL=22
W_LAPTOP=22
NICE=19                 # house rule: long cluster workers yield to interactive use
RUST_THREADS=1          # enforced by the harness when workers>1; W x t oversubscription
                        # is the failure mode (docs/CLUSTER_OPS.md "Farm rule")

# --- ⛔ THE WHEEL IS SHIPPED, NEVER REBUILT (DESIGN.md SS7) --------------------
# G-WHEEL-SAME keys on carc_rs_binary_sha, and round 2 inherits round 1's IDENT PASS,
# which was measured on the wheel below. The executor installs THE SAME WHEEL FILE on
# BOTH boxes (scp + pip install into the laptop's venv), so the sha is IDENTICAL on
# every cell regardless of host and the gate passes on both.
# ⛔ NEVER a laptop-local `maturin build`: a different build produces different bytes,
# a different sha, and the gate REFUSES -- correctly, because a different box's wheel is
# one whose weight-0 identity this program has never checked.
WHEEL_FILE=/home/doctor/carc_wheels/carc_rs-0.1.0-cp312-abi3-manylinux_2_34_x86_64.whl

# --- RAM preflight + runtime floor (DESIGN.md SS6.3) ---------------------------
# ⚠️ RAM, NOT CPU, IS THIS PAIR'S REAL CO-TENANCY RISK. The pair is result-safe beside
# other compute (DESIGN.md SS6.3), but a WSL guest OOM tears down the WHOLE VM, not one
# worker (reference_wsl2_host_memory_teardown), and the reconcile solver it shares the
# box with carries a 30 GB job cap. These two floors are the ONLY hard tenancy checks.
PREFLIGHT_RAM_FLOOR_MB=4000   # refuse to START below this
RUNTIME_RAM_FLOOR_MB=1500     # checked between passes; below it, abort fail-closed

# --- the band (DESIGN.md SS5) --------------------------------------------------
# 152000000000 == the next free band, established by the ALL-BRANCHES sweep re-run
# 2026-08-27 over 143 refs / 723 registry-and-claim files: no ref, no registry version
# and no claim file mentions any band at or above 152e9. 151000000000 is SPENT by round
# 1; 150e9 SPENT by D2 attempt 4; 149e9 RETIRED; 146e9 remains soft-reserved by
# track_d1_fair_rebase and is skipped for the same reason five prior pairs skipped it.
# NO TOP-UP RANGE IS RESERVED -- READ_RULE.md SS5 carries no top-up branch; a bounded
# null is the licensed outcome of a screen, not a failure state.
BAND=152000000000

# --- the instrument: DESIGN.md SS2, identical on BOTH sides of every cell -------
OPPONENT_MODE=fair-champion   # a _HEAD_TO_HEAD mode => converted_sides == [candidate, opponent]
BACKEND=rust                  # ⛔ NOT a speed preference: the invasion family exists ONLY
                              # in rust; both python leaves RAISE on a nonzero weight.
                              # ⚠️ ROUND 2 NEEDS THIS ON THE OPPONENT SIDE TOO -- the C
                              # cells' OPPONENT carries a nonzero weight.
INFO_MODE=fair                # fair PIMC, NOT clairvoyant
RULES_PROFILE=fixed_v1
FIX_R9=1                      # exported as CARCASSONNE_FIX_R9 BEFORE any import (OnceLock)
EXACT_K=2                     # the fair deployable handoff; K=3/4 are clairvoyant-only
C_PUCT=1.5
TAU_P=5
LEAF_QUANTIZE=float
FINAL_SELECT=visits

# --- the budget: k4 x 688 = 2752 total sims, BOTH sides (DESIGN.md SS2.4) -------
# ⚠️ THIS IS THE SCREENING BUDGET, NOT PRODUCTION (k8x1376 = 11008). The harness prints
# a NON-FATAL [warn] saying so on every cell -- EXPECTED, do not suppress it.
K_DETS=4
SIMS_PER_DET=688
TOTAL_SIMS=2752

# --- THE SHAPE-B OPPONENT ENV (DESIGN.md SS2.5) --------------------------------
# ⭐ HOW THE THREE C CELLS GET A NON-CHAMPION OPPONENT. eval_fair_puct.py:3774 hands
# every head-to-head opponent `_curve125_leaf_cfg()` UNCONDITIONALLY and there is no
# --opp-leaf-json flag of any spelling -- but that function is
# dataclasses.replace(DEFAULT_CONFIG, v29_meeple_curve=CURVE125) and DEFAULT_CONFIG is
# resolved FROM THE ENVIRONMENT at virtual_score_v2 import time. Exporting these two
# BEFORE the process starts moves the OPPONENT's leaf to the shape-B agent; the
# CANDIDATE takes them back off with EXPLICIT ZEROS in its own --cand-leaf-json.
#
# ⚠️ build_argv() emits BOTH variables on EVERY cell, set to 0.0/0.0 on the A/B cells.
# That is deliberate: an A/B cell PINS the regime OFF in its own argv rather than
# relying on the absence of a variable, so a stray export in the orchestrator's shell
# cannot silently give an A/B cell a shape-B opponent. float("0.0") == the dataclass
# default, so a pinned-off cell is byte-identical to an unset one.
SHAPE_B_ALPHA=0.09
SHAPE_B_ALPHA_CAP=11.0
SHAPE_B_LEAF_HASH=42adadc988784b44   # == round 1's B_MID candidate, bit-for-bit

# --- the pinned leaf hashes (DESIGN.md SS2.2, READ_RULE.md SS3 G-LEAF) ---------
# COMPUTED AT FREEZE from the seven JSONs in this directory, through the harness's OWN
# _load_cand_leaf_cfg + _leaf_hash, ONCE PER ENV REGIME. The derivation was validated
# by reproducing all three of round 1's frozen hashes exactly.
#
# ⭐ ROUND 2 PINS **BOTH** SIDES OF EVERY CELL. Round 1 could pin the opponent as a
# constant; three of round 2's seven play the shape-B agent. And the pins are what make
# the C cells checkable at all: --allow-leaf-hash-drift relaxes the harness's assertion
# on BOTH sides (eval_fair_puct.py:3763 candidate, :3777 opponent), so on a C cell "the
# opponent leaf drifted" is EXPECTED and is therefore not a tell -- only exact equality
# against a pre-registered pin distinguishes "drifted to the shape-B agent" from
# "drifted to something else".
PROD_LEAF_HASH=a36d2e15a3b3d71d       # == governance/PRODUCTION.yaml champion.leaf_hash
CAND_LEAF_HASH_A_LOW=f8c0f04092734f9e
CAND_LEAF_HASH_A_HIGH=f6ce81145cbd5102
CAND_LEAF_HASH_B_LOW=f5b7a26216794290
CAND_LEAF_HASH_B_HIGH=1a42effad7066c0b
CAND_LEAF_HASH_C_LOW=a6ab04dbb69ad29e
CAND_LEAF_HASH_C_MID=897c21aca11b6fbd
CAND_LEAF_HASH_C_HIGH=df34cb874fea6273
OPP_LEAF_HASH_A_LOW=a36d2e15a3b3d71d
OPP_LEAF_HASH_A_HIGH=a36d2e15a3b3d71d
OPP_LEAF_HASH_B_LOW=a36d2e15a3b3d71d
OPP_LEAF_HASH_B_HIGH=a36d2e15a3b3d71d
OPP_LEAF_HASH_C_LOW=42adadc988784b44
OPP_LEAF_HASH_C_MID=42adadc988784b44
OPP_LEAF_HASH_C_HIGH=42adadc988784b44

# --- THE INHERITED IDENT (DESIGN.md SS3.1, READ_RULE.md SS3 G-WHEEL-SAME) -------
# ⛔ ROUND 2 RUNS NO IDENT CELL. It inherits round 1's PASS (400 games, z 0.9624, all
# conjuncts), and the inheritance is MECHANISED: the manifest's carc_rs_binary_sha must
# be byte-identical to the wheel round 1 measured it on. A CHANGED WHEEL -- or a
# different BOX, since the sha is box-local -- RE-OWES AN IDENT CELL.
#
# ⚠️ carc_rs_build is NOT a wheel discriminator and is NOT gated on. It embeds the REPO
# REV AT CALL TIME, not a compiled-in value: round 1's own smoke and cell archives
# carry DIFFERENT build strings (47e7cc0ffb31 vs ac709c42c6e2) and the SAME binary sha.
# This build found that by failing its own selftest against round 1's emitted archive;
# see screen_lib.py's R1_WHEEL_BINARY_SHA banner.
R1_WHEEL_BINARY_SHA=a9ac686bca1417f9

# --- TIE-ARBITER: OFF ON BOTH SIDES (DESIGN.md SS0(d), READ_RULE.md SS3 G-TIEARB)
# ⛔ NO --cand-tiearb-* FLAG IS EVER PASSED BY run_cells.sh. The opponent side is
# STRUCTURALLY disarmed -- no --opp-tiearb-* flag of any spelling exists in
# eval_fair_puct.py. G-TIEARB asserts the ABSENCE in the manifest.
TIEARB=off

# --- passes, timeouts and the void-rate circuit breaker (DESIGN.md SS6) --------
# eval_fair_puct.py has NO --limit flag, so "chunking" is bounded PASSES over the full
# range under --shared-claim: each pass is one `timeout`d invocation, the harness skips
# already-recorded cells, and the FINAL pass walks the whole range and therefore writes
# the pooled summary.json the adjudicator reads.
CHUNK_GAMES=100          # games a pass is SIZED to complete
PASS_TIMEOUT_SECS=1800   # DERIVATION (DESIGN.md SS6.1): round 1 REALIZED 79-87 worker-s
                         # per game on its arms; a C cell projects ~97. 100 games at
                         # W=22 = 100 x 97 / 22 = 441 s expected. x3 margin = 1323 s,
                         # rounded UP to 1800 s because shape C's per-move cost is the
                         # round's ONE unmeasured input and a co-tenant may slow
                         # wall-clock (result-safe here, DESIGN.md SS6.3, but it must
                         # not trip a timeout). Round 1 ran the same 1800 s cleanly.
MAX_PASSES=24            # ~8 passes expected per 800-game cell; 24 bounds a pathological
                         # resume loop. Hard ceiling: 24 x 1800 s = 12 h per cell.
CLAIM_STALE_SECS=1800    # ~20x one game's expected duration (~90 s)
VOID_RATE_ABORT_PCT=10   # LAUNCHER-SAFETY breaker, DISTINCT from READ_RULE.md SS3's
                         # G-N adjudication bar (<2%, decided after the fact).

# --- repo root / paths ---------------------------------------------------------
# ⭐ THE OUT-ROOT IS ON THE SHARE, NOT IN THE REPO, because the LOCAL box adjudicates
# over BOTH boxes' archives and can only see the laptop's cells if the laptop writes
# them to the share.
# ⚠️ THE MOUNT SPELLING DIFFERS BY BOX (CLAUDE.md): local /mnt/c/carc-shared, and
# anything running INSIDE the laptop /mnt/carc-shared. run_cells.sh picks the right one
# from --host and screen_lib.BOXES[role]["share_mount"]; a launcher that used the wrong
# one would write outside the share and the adjudicator would never see the archive.
REPO_LOCAL=/home/doctor/projects/carcassone
RUN_ID=invasion_screen_r2_20260827
OUT_LEAF=invasion_screen_r2_20260827
SHARE_LOCAL=/mnt/c/carc-shared
SHARE_LAPTOP=/mnt/carc-shared   # allow-path: the laptop-side spelling, used only under --host laptop

# --- the adjudicator + the shared bar library (READ_RULE.md SS7) ---------------
ADJUDICATOR=measurement/invasion_screen_r2_prep/analyze_screen.py
SCREEN_LIB=measurement/invasion_screen_r2_prep/screen_lib.py

# --- ⭐ ONE SS9 SMOKE PER BOX, each on its own disjoint throwaway sub-range -----
# A single-box round could smoke once. A TWO-box round cannot: each box has its own
# wheel install, its own repo checkout, its own share mount and its own W, and the SS9
# leg exists to prove the plumbing ON THE MACHINE THAT WILL SPEND THE DECKS.
#
# LAPTOP -> C_MID (the load-bearing one). The laptop owns the three C cells, which are
#   simultaneously round 2's NEW MACHINERY (the shape-B env regime, a non-champion
#   opponent leaf, the explicit-zero neutralisation, a THREE-key leaf diff, two-sided
#   hash pins) AND the box's first sight of any of it. C_MID rather than C_LOW/C_HIGH
#   because the interior rung is the one SS4.7's noise-signature rule reads.
# LOCAL  -> B_LOW. The local box owns the four A/B cells, whose PLAIN-regime plumbing
#   round 1 already proved on this exact box with this exact wheel, so this leg is a
#   cheap re-confirmation of the launcher and the wheel install rather than a first
#   sight. B rather than A because B is the only A/B config with the cap-forwarding
#   biconditional to break.
#
# ⛔ Both ranges are DISJOINT from each other and from every cell; both are DISCARDED,
# never pooled, never claimed. The cells and seed starts are frozen in
# screen_lib.SMOKE_BY_BOX; the launcher reads them from there, not from here.
SMOKE_GAMES=16
SMOKE_WORKERS=8
