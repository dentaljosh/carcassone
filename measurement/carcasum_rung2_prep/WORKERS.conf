# WORKERS.conf — the ONE place per-box worker counts and run constants live for
# the CARCASUM RUNG-2 BUDGET LADDER (`measurement/carcasum_rung2_prep/`).
#
# Sourced at the top of run_cells.sh:
#     . "$(dirname "$0")/WORKERS.conf"
#
# TO CHANGE A WORKER COUNT, EDIT THE VALUE HERE AND NOTHING ELSE. No launcher
# hard-codes a count. (House discipline, carried from tiearb_widening_20260817's
# WORKERS.conf files and track_d2_prep's.)
#
# THE PAIR IS LAW. Every constant below is READ from DESIGN.md / READ_RULE.md;
# none is invented here. A launcher that disagrees with the pair is a LAUNCHER
# defect -- the pair does not move.

# --- the blind commit every manifest must carry (READ_RULE.md preamble) ------
# A commit cannot name its own hash from inside itself, so this stays PENDING
# in EVERY freeze/amendment commit -- a small FOLLOW-UP commit stamps the real
# sha before any real launch (this repo's own 71b3286c -> 7fd9c8de precedent,
# and this cell's own e48d086e -> 314473ed precedent from the original freeze).
# AMENDMENT (2026-08-23): re-stamped to the AMENDMENT commit's own sha by the
# SAME follow-up-commit convention -- the original 314473ed value is now
# superseded, since this file's own content changed (D0 added, shared decks).
# HEALTHY RUN -> a 8..40 hex-char commit hash, written by that follow-up commit.
# FIRES       -> the literal string PENDING (the drafted value) -- run_cells.sh
#                REFUSES a non-dry, non-smoke launch while it reads PENDING.
# --dry-run and the G-MODE smoke are exempt: both spend zero blindness.
BLIND_COMMIT=49860453

# --- worker count (single box: this ladder was funded for the laptop) --------
# DESIGN.md §6 projects wall-clock at W=14 -- the laptop's standing recommended
# W for this harness (rung 1's own PREREG.md §4.3: "smallest W within ~10% of
# practical peak"). No local-box leg: this cell is a single-box ladder unless
# the orchestrator splits it at launch time (not designed here).
W_LAPTOP=14
NICE=19         # house rule: long cluster workers yield to interactive use

# --- the four rungs (DESIGN.md §2 -- D0 added by the pre-launch amendment) ---
# ⚠️ Each rung differs from the others in EXACTLY ONE argument: --opp-playouts.
# Everything else (champion config, rules profile, opponent identity/Cp/utility/
# playout policy) is the SAME invocation shape as rung 1's own launch command
# (measurement/carcasum_match_prep/LAUNCH_PROCEDURE.md §1), with --opp-budget-ms
# replaced by --opp-playouts. EXECUTION ORDER IS CHEAPEST-FIRST: D0, A, B, C.
RUNG_D0_NAME=rungD0_0.5x
RUNG_D0_PLAYOUTS=16384     # 2^14, 0.5x -- amendment: thesis doubling-table cross-check
RUNG_A_NAME=rungA_2x
RUNG_A_PLAYOUTS=65536      # 2^16, 2x the calibrated median base (32551 -> 2^15)
RUNG_B_NAME=rungB_4x
RUNG_B_PLAYOUTS=131072     # 2^17, 4x
RUNG_C_NAME=rungC_8x
RUNG_C_PLAYOUTS=262144     # 2^18, 8x
RUNG_ORDER="RUNG_D0 RUNG_A RUNG_B RUNG_C"    # cheapest-first, read by run_cells.sh

# --- n (DESIGN.md §2: 100 decks x 2 seatings = 200 games per rung) -----------
N_DECKS=100
N_GAMES=200
N_COMMON_FLOOR=80          # READ_RULE.md §3 G-N -- 80% of N_DECKS

# --- the band (DESIGN.md §4 -- AMENDED: ONE shared 100-deck range) -----------
# Claimed from governance/BAND_REGISTRY.csv (high-water mark 142000000000, rung
# 1's own claim, on branch carcasum-match-freeze). RE-VERIFY both the registry
# AND a live-run process census immediately before claiming -- rung 1's own
# PREREG.md §3 lost band 141e9 exactly this way once.
#
# ⚠️ AMENDMENT: D0, A, B, AND C ALL DRAW THE SAME SEED RANGE (shared decks, for
# the within-deck slope estimator, READ_RULE.md §1.1). This is NOT a per-rung
# offset scheme like the pre-amendment draft's -- there is exactly ONE range,
# reused four times. Per-rung separation is by OUTPUT PATH ONLY (each rung's own
# out-subdir; match.py's own --resume dedup is keyed within ONE archive file, so
# distinct --out paths are what keeps the four rungs' games from colliding, not
# distinct seeds).
BAND=143000000000
SHARED_DECK_SEED_START=143000000000    # ..000000099 (100 decks) -- ALL FOUR RUNGS
SHARED_DECK_SEED_END=143000000099
BAND_SENTINEL=BAND_CLAIM.json

# --- rung 0 (r1's already-collected corpus -- NOT re-run, NOT re-claimed) ----
RUNG0_GAMES_PATH=measurement/carcasum_match_20260823/games.jsonl
RUNG0_BAND=142000000000

# --- the opponent config held fixed across all rungs (DESIGN.md §0) ----------
OPP_KIND=mcts
OPP_CP=0.5
OPP_UTILITY=portion
OPP_PLAYOUT_POLICY=random
RULES_PROFILE=fixed_v1

# --- the smoke (DESIGN.md §8 -- ALREADY EXECUTED at freeze time) -------------
SMOKE_PLAYOUTS=1000
SMOKE_DECKS=2
SMOKE_SEED_BASE=900000500000      # dev-tier throwaway, NEVER pooled/claimed
SMOKE_GATE_TOLERANCE_PCT=5        # READ_RULE.md §3 G-MODE
SMOKE_RESULT=PASS                 # 0.0% deviation, n=71 real opponent turns

# --- abort-to-partial (DESIGN.md §6) ------------------------------------------
RUNG_D0_ABORT_SECS=4685   # 2x linear projection (0.65h)
RUNG_A_ABORT_SECS=12034   # 2x linear projection (1.67h)
RUNG_B_ABORT_SECS=21834   # 2x linear projection (3.03h)
RUNG_C_ABORT_SECS=41434   # 2x linear projection (5.76h)

# --- interim futility test (READ_RULE.md §5, amendment, kill-only) -----------
# Run after EVERY completed rung except the last (D0, A, B -- never after C,
# which is simply the final read). Uses the SECONDARY aggregate fit (rung 0 +
# completed shared-deck rungs so far); exits 42 (INTERIM_KILL_EXIT_CODE) if it
# fires, 0 otherwise. run_cells.sh checks this exit code, not stdout parsing.
INTERIM_KILL_EXIT_CODE=42
INTERIM_Z_THRESHOLD=2.0    # z_slope_agg >= +this AND beta1_agg >= 0 -> fires

# --- repo root -----------------------------------------------------------------
# ⚠️ NO $SHARE path here, deliberately: this cell's output goes to a REPO-relative
# measurement/ dir (OUT_SUBDIR below), matching rung 1's own LAUNCH_PROCEDURE.md
# ("--out $CELL/games.jsonl" where $CELL=measurement/carcasum_match_20260823),
# never to the /mnt/c/carc-shared or /mnt/carc-shared cluster share -- there is no
# cross-box worker split to coordinate for a single-box (laptop) run. Repo root is
# identical on every box in this project (the CLUSTER_OPS invariant is about the
# SHARE mount, not this path), so ONE constant, not a local/remote pair.
REPO_LOCAL=/home/doctor/projects/carcassone

# --- run identity --------------------------------------------------------------
RUN_ID=carcasum_rung2_20260823
OUT_SUBDIR=measurement/carcasum_rung2_20260823

# --- the adjudicator (DESIGN.md §7) -------------------------------------------
ADJUDICATOR=scripts/carcasum_match/analyze_ladder.py
