# WORKERS.conf -- the ONE place per-box worker counts and run constants live for the
# INVASION-RISK TERM FAMILY ROUND-3 FINE LADDERS + JOINT (measurement/invasion_screen_r3_prep/).
#
# Sourced at the top of run_cells.sh:  . "$(dirname "$0")/WORKERS.conf"
#
# TO CHANGE A CONSTANT, EDIT HERE AND NOTHING ELSE. No launcher hard-codes a value.
# THE PAIR IS LAW -- every constant below is read from DESIGN.md / READ_RULE.md; a
# launcher that disagrees with the pair is a launcher defect, the pair does not move.
#
# ⚠️ THE BARS ARE NOT HERE. Every bar, threshold, cost figure and weight lives in ONE
# implementation, screen_lib.py, imported by BOTH the adjudicator and this launcher's
# precondition ladder -- so the launcher's in-flight per-cell pre-check and the
# adjudicator's own G-LEAF cannot drift apart. This file carries only the run's
# OPERATIONAL constants (W, RAM floors, timeouts, paths) plus the band, and
# tests/test_invasion_screen_r3_instrument.py asserts BAND == screen_lib.BAND.

# --- the blind commit every read-out must be gated against (READ_RULE.md SS3) ---
# A commit cannot name its own hash from inside itself -- stays PENDING at the freeze
# commit; a small FOLLOW-UP commit stamps the real sha before any real launch.
# HEALTHY -> a 40-hex commit sha (also written to the sibling BLIND_COMMIT file).
# FIRES (refuses a real launch) -> the literal string PENDING.
# --dry-run and the SS9 smoke are EXEMPT (they spend no blindness, no band).
BLIND_COMMIT=PENDING

# --- source-revision pin (the d1-rebase G-REV machinery, ported) ----------------
# The 40-hex sha the WHOLE ROUND must run at, in the sibling file PINNED_SRC_REV.
# Re-asserted BEFORE and AFTER every pass of every cell; a moved HEAD or a dirty
# src/engine/scripts/rust/tests ABORTS rather than producing a mixed-rev archive.
#
# ⭐ IT IS THE ORCHESTRATOR'S LAUNCH ACT, and the one step that cannot be done inside
# the freeze ceremony: it must equal `git rev-parse HEAD` EXACTLY at launch, and a
# commit cannot contain its own sha, so it is written UNCOMMITTED ON EACH BOX,
# immediately before `chmod +x run_cells.sh`:
#
#     git -C /home/doctor/projects/carcassone rev-parse HEAD \
#       > /home/doctor/projects/carcassone/measurement/invasion_screen_r3_prep/PINNED_SRC_REV
#
# ⛔⛔ AND IT IS OWED **PER BOX**, ON BOTH BOXES, AND THE TWO MUST BE BYTE-IDENTICAL.
# This is the artifact round 2's IS-A1 defect turned on: G-REV's cross-box clause now
# canonicalizes every emitted short rev AGAINST THIS PIN (screen_lib.cross_box_rev_gate)
# and REQUIRES THE TWO BOXES' PIN FILES TO AGREE. A laptop that was never bundle-synced
# publishes a different pin and the round refuses -- correctly, and BEFORE the numbers
# are read rather than after.
#
# SAFE: measurement/ is DELIBERATELY EXCLUDED from the clean-source check (CODE_PATHS
# is src/ engine/ scripts/ rust/ tests/ pyproject.toml setup.py ONLY), so writing it
# does not dirty the source tree and does not trip the launcher's own gate.
# BLIND_COMMIT is the OPPOSITE: committed, and must be an ANCESTOR of HEAD.
PINNED_SRC_REV_FILE=PINNED_SRC_REV
SRC_CLEAN_LOG=SRC_CLEAN.jsonl
BAND_SENTINEL=BAND_CLAIMED

# --- ⭐ TWO BOXES (DESIGN.md SS6.5) --------------------------------------------
# ⛔ THE CELL->BOX ASSIGNMENT IS FROZEN IN screen_lib.py (CellSpec.box), NOT HERE, and
# G-HOST enforces it against the emitted manifest. run_cells.sh takes --host local|laptop
# and runs EXACTLY that box's cells, refusing any other. WHOLE CELLS PER BOX.
#
#     --host local   -> C_LOW C_MID C_HIGH                      (W=14, /mnt/c/carc-shared)
#     --host laptop  -> A_LOW A_MID A_HIGH J_LOW J_HIGH         (W=22, /mnt/carc-shared)
#
# ⛔ THIS IS THE OPPOSITE OF ROUND 2's ASSIGNMENT, AND DELIBERATELY SO. See W_LOCAL below:
# the owner's W_LOCAL=14 constraint cuts local throughput by 36% and moves the balance
# point past the flip, so the whole-shape split that minimises the ROUND WALL is now
# "C on local, A+J on laptop" (4.98 h) rather than round 2's "A/B on local, C on laptop"
# (which at this W would read 7.15 h). All six partitions are priced in DESIGN SS6.5(iii)
# and screen_lib.split_table(), and sanity_check() REFUSES a pair whose frozen assignment
# is not the fastest one.
#
# ⭐ EVERY PRE-REGISTERED CONTRAST IS WITHIN ONE BOX. Shapes are assigned whole, so
# SS4.5's low-vs-high contrast, SS4.5b's interior-lift statistic and SS4.7's
# noise-signature check are ALL within-box. That is what lets the round avoid relying on
# cross-box float identity, which this program HAS been bitten by (the Xeon was
# RE-RETIRED 2026-08-02 because AVX-512 makes the G0 determinism check FAIL).
#
# ⚠️ W IS THROUGHPUT-ONLY on either box. Games are BIT-IDENTICAL at any W
# (rust/carc/carc-core/src/fair/mod.rs:22-32 -- the determinization merge is a sequential
# fold after every join). No statistic, gate, claim or branch moves with W.
#
# ⛔⛔ W_LOCAL=14, FROZEN FOR THE WHOLE ROUND. OWNER CONSTRAINT 2026-08-27, verbatim:
#     "limit local to w14 starting at 11am"
# The round straddles 11:00 EDT / 15:00Z, the owner's interactive-use window
# (feedback_desktop_friendly_selfplay). ⛔ NOT 22-then-14: `--workers` is a PER-INVOCATION
# argv value and a cell runs in bounded resumable passes, so a mid-round change would run
# one cell's passes at two different W and destroy the comparability of the launcher's own
# realized worker-s/game log; and a frozen pair does not move after the blind commit.
# The cheap direction is obvious -- 14 for the whole round costs ~0 h of ROUND wall,
# because at this split the LAPTOP is the critical path either way (4.98 h vs local's
# 4.43 h) -- and it buys certainty that no local cell ever competes with the desktop.
#
# W_LAPTOP=22 is unchanged from round 2, which ran three cells at it cleanly, and is
#             h2h_22016_prep's W_LAPTOP -- the closest precedent by workload class (a
#             rust eval_fair_puct head-to-head with BOTH sides converted), sized DOWN
#             from W26 against the laptop's 11 GB ceiling.
#             ⚠️ NOT the W=14 of the carcasum pairs: those run a JVM opponent process per
#             game and are a different memory shape entirely. The coincidence with
#             W_LOCAL=14 this round is exactly that -- a coincidence.
W_LOCAL=14
W_LAPTOP=22
NICE=19                 # house rule: long cluster workers yield to interactive use
RUST_THREADS=1          # enforced by the harness when workers>1; W x t oversubscription
                        # is the failure mode (docs/CLUSTER_OPS.md "Farm rule")

# --- ⛔ THE WHEEL IS SHIPPED, NEVER REBUILT (DESIGN.md SS7) --------------------
# G-WHEEL-SAME keys on carc_rs_binary_sha, and round 3 inherits round 1's IDENT PASS --
# for the SECOND time, round 2 having carried it once already with all seven of its cells
# reporting the pinned sha. The executor installs THE SAME WHEEL FILE on BOTH boxes
# (scp + pip install into the laptop's venv), so the sha is IDENTICAL on every cell
# regardless of host and the gate passes on both.
# ⛔ NEVER a laptop-local `maturin build`: a different build produces different bytes,
# a different sha, and the gate REFUSES -- correctly, because a different box's wheel is
# one whose weight-0 identity this program has never checked.
WHEEL_FILE=/home/doctor/carc_wheels/carc_rs-0.1.0-cp312-abi3-manylinux_2_34_x86_64.whl

# --- RAM preflight + runtime floor (DESIGN.md SS6.3) ---------------------------
# ⚠️ RAM, NOT CPU, IS THIS PAIR'S REAL CO-TENANCY RISK. The pair is result-safe beside
# other compute, but a WSL guest OOM tears down the WHOLE VM, not one worker
# (reference_wsl2_host_memory_teardown), and the reconcile solver it may share the local
# box with carries a 30 GB job cap. These two floors are the ONLY hard tenancy checks.
PREFLIGHT_RAM_FLOOR_MB=4000   # refuse to START below this
RUNTIME_RAM_FLOOR_MB=1500     # checked between passes; below it, abort fail-closed

# --- the band (DESIGN.md SS5) --------------------------------------------------
# 153000000000 == the next free band, established by the ALL-BRANCHES sweep re-run
# 2026-08-27 over 147 refs (127 refs/heads + 20 refs/remotes) / 808 registry-and-claim
# files: EVERY mention of any band at or above 152e9, on any ref, is round 2's OWN, and a
# direct `^15[3-9]000000000,` row-start grep over every ref's BAND_REGISTRY.csv returned
# ZERO hits. 152e9 is SPENT by round 2; 151e9 by round 1; 150e9 by D2 attempt 4; 149e9
# RETIRED; 146e9 remains soft-reserved by track_d1_fair_rebase and is skipped for the same
# reason six prior pairs skipped it.
# NO TOP-UP RANGE IS RESERVED -- READ_RULE.md SS5 carries no top-up branch; a bounded
# null is the licensed outcome of a screen, not a failure state.
BAND=153000000000

# --- the instrument: DESIGN.md SS2, identical on BOTH sides of every cell -------
OPPONENT_MODE=fair-champion   # a _HEAD_TO_HEAD mode => converted_sides == [candidate, opponent]
BACKEND=rust                  # ⛔ NOT a speed preference: the invasion family exists ONLY
                              # in rust; both python leaves RAISE on a nonzero weight.
                              # ⚠️ NEEDED ON THE OPPONENT SIDE TOO -- the C cells' OPPONENT
                              # carries a nonzero weight.
INFO_MODE=fair                # fair PIMC, NOT clairvoyant
RULES_PROFILE=fixed_v1
FIX_R9=1                      # exported as CARCASSONNE_FIX_R9 BEFORE any import (OnceLock)
EXACT_K=2                     # the fair deployable handoff; K=3/4 are clairvoyant-only
C_PUCT=1.5
TAU_P=5
LEAF_QUANTIZE=float
FINAL_SELECT=visits

# --- the budget: k4 x 688 = 2752 total sims, BOTH sides (DESIGN.md SS2.4) -------
# ⚠️ THIS IS THE SCREENING BUDGET, NOT PRODUCTION (k8x1376 = 11008). The harness prints
# a NON-FATAL [warn] saying so on every cell -- EXPECTED, do not suppress it.
K_DETS=4
SIMS_PER_DET=688
TOTAL_SIMS=2752

# --- THE SHAPE-B OPPONENT ENV (DESIGN.md SS2.5) --------------------------------
# ⭐ HOW THE THREE C CELLS GET A NON-CHAMPION OPPONENT. eval_fair_puct.py:3774 hands
# every head-to-head opponent `_curve125_leaf_cfg()` UNCONDITIONALLY and there is no
# --opp-leaf-json flag of any spelling -- but that function is
# dataclasses.replace(DEFAULT_CONFIG, v29_meeple_curve=CURVE125) and DEFAULT_CONFIG is
# resolved FROM THE ENVIRONMENT at virtual_score_v2 import time. Exporting these two
# BEFORE the process starts moves the OPPONENT's leaf to the shape-B agent; the
# CANDIDATE takes them back off with EXPLICIT ZEROS in its own --cand-leaf-json.
#
# ⚠️ build_argv() emits BOTH variables on EVERY cell, set to 0.0/0.0 on the A and J cells.
# That is deliberate: an A/J cell PINS the regime OFF in its own argv rather than relying
# on the absence of a variable, so a stray export in the orchestrator's shell cannot
# silently give a champion-opponent cell a shape-B opponent -- which on a J cell would be
# the single most damaging thing this launcher could do, because the J cells are the
# adoption-chain-eligible ones. float("0.0") == the dataclass default, so a pinned-off
# cell is byte-identical to an unset one.
#
# ⭐ SHAPE B IS THE INVADER-GENERATOR INSTRUMENT, NOT A ROUND-3 CANDIDATE. Round 2 demoted
# it on a noise signature and round 3 runs no B candidate cell. Using a demoted shape as
# an instrument is not a claim about it as a candidate (screen_lib.
# SHAPE_B_IS_AN_INSTRUMENT_NOT_A_CANDIDATE).
SHAPE_B_ALPHA=0.09
SHAPE_B_ALPHA_CAP=11.0
SHAPE_B_LEAF_HASH=42adadc988784b44   # == round 1's B_MID candidate and round 2's C opponent

# --- the pinned leaf hashes (DESIGN.md SS2.2, READ_RULE.md SS3 G-LEAF) ---------
# COMPUTED AT FREEZE from the eight JSONs in this directory, through the harness's OWN
# _load_cand_leaf_cfg + _leaf_hash, ONCE PER ENV REGIME. The derivation was validated by
# reproducing ALL ELEVEN hashes rounds 1 and 2 froze, exactly, before a single round-3
# hash was computed.
#
# ⭐ BOTH SIDES OF EVERY CELL ARE PINNED. The pins are what make the cells checkable at
# all: --allow-leaf-hash-drift relaxes the harness's assertion on BOTH sides
# (eval_fair_puct.py:3763 candidate, :3777 opponent), so on a C cell "the opponent leaf
# drifted" is EXPECTED and is therefore not a tell -- only exact equality against a
# pre-registered pin distinguishes "drifted to the shape-B agent" from "drifted to
# something else".
PROD_LEAF_HASH=a36d2e15a3b3d71d       # == governance/PRODUCTION.yaml champion.leaf_hash
CAND_LEAF_HASH_A_LOW=e62afec3a84dfabd     # invasion_beta 0.02
CAND_LEAF_HASH_A_MID=9da236cf49065a21     # invasion_beta 0.05
CAND_LEAF_HASH_A_HIGH=1fed3422b67be1d5    # invasion_beta 0.10
CAND_LEAF_HASH_J_LOW=9e2764605c0b2fff     # ⭐ invasion_beta 0.02 + invasion_gamma 0.03
CAND_LEAF_HASH_J_HIGH=d193865634f14543    # ⭐ invasion_beta 0.05 + invasion_gamma 0.07
CAND_LEAF_HASH_C_LOW=86a6efb793a40ef2     # invasion_gamma 0.03 (+ explicit alpha zeros)
CAND_LEAF_HASH_C_MID=f05d8576b7a6cc23     # invasion_gamma 0.07 (+ explicit alpha zeros)
CAND_LEAF_HASH_C_HIGH=a8e9083b102a52cf    # invasion_gamma 0.15 (+ explicit alpha zeros)
OPP_LEAF_HASH_A_LOW=a36d2e15a3b3d71d
OPP_LEAF_HASH_A_MID=a36d2e15a3b3d71d
OPP_LEAF_HASH_A_HIGH=a36d2e15a3b3d71d
OPP_LEAF_HASH_J_LOW=a36d2e15a3b3d71d      # ⭐ THE CHAMPION -- this is what makes J
OPP_LEAF_HASH_J_HIGH=a36d2e15a3b3d71d     #    adoption-chain-eligible
OPP_LEAF_HASH_C_LOW=42adadc988784b44
OPP_LEAF_HASH_C_MID=42adadc988784b44
OPP_LEAF_HASH_C_HIGH=42adadc988784b44

# --- THE INHERITED IDENT (DESIGN.md SS3.1, READ_RULE.md SS3 G-WHEEL-SAME) -------
# ⛔ ROUND 3 RUNS NO IDENT CELL. It inherits round 1's PASS (400 games, z 0.9624, all
# conjuncts) for the SECOND time -- round 2 carried it once and it HELD, all seven cells
# reporting the pinned sha across BOTH boxes. The inheritance is MECHANISED: the
# manifest's carc_rs_binary_sha must be byte-identical to the wheel round 1 measured it
# on. A CHANGED WHEEL -- or a different BOX, since the sha is box-local -- RE-OWES AN
# IDENT CELL.
#
# ⚠️ carc_rs_build is NOT a wheel discriminator and is NOT gated on. It embeds the REPO
# REV AT CALL TIME, not a compiled-in value: round 1's smoke and cell archives carry
# DIFFERENT build strings (47e7cc0ffb31 vs ac709c42c6e2) with the SAME binary sha, and
# round 2's seven cells carry a third (240626a31fee) with that same sha again.
R1_WHEEL_BINARY_SHA=a9ac686bca1417f9

# --- TIE-ARBITER: OFF ON BOTH SIDES (DESIGN.md SS0(d), READ_RULE.md SS3 G-TIEARB)
# ⛔ NO --cand-tiearb-* FLAG IS EVER PASSED BY run_cells.sh. The opponent side is
# STRUCTURALLY disarmed -- no --opp-tiearb-* flag of any spelling exists in
# eval_fair_puct.py. G-TIEARB asserts the ABSENCE in the manifest.
TIEARB=off

# --- passes, timeouts and the void-rate circuit breaker (DESIGN.md SS6) --------
# eval_fair_puct.py has NO --limit flag, so "chunking" is bounded PASSES over the full
# range under --shared-claim: each pass is one `timeout`d invocation, the harness skips
# already-recorded cells, and the FINAL pass walks the whole range and therefore writes
# the pooled summary.json the adjudicator reads.
CHUNK_GAMES=100          # games a pass is SIZED to complete
PASS_TIMEOUT_SECS=2700   # ⛔ RAISED FROM ROUND 2's 1800 s, AND THE REASON IS W_LOCAL=14.
                         # DERIVATION (DESIGN.md SS6.1): round 2 REALIZED 84.75 (A) / 79.25
                         # (B) / 100.67 (C on laptop) worker-s per game. 100 games at the
                         # DEAREST cell on each box:
                         #   local  C @ W=14: 100 x 93.1 / 14 = 665 s expected
                         #   laptop J @ W=22: 100 x 105.9 / 22 = 481 s expected
                         # x3 margin on the local figure = 1995 s, rounded UP to 2700 s
                         # because the JOINT leaf's per-move cost is the round's ONE
                         # unmeasured input and a co-tenant may slow wall-clock
                         # (result-safe, DESIGN.md SS6.3, but it must not trip a timeout).
                         # ⚠️ Round 2's 1800 s would have left the local box only a 2.7x
                         # margin at W=14 -- still workable, but the cost of a too-tight
                         # timeout is a stalled resume loop and the cost of a loose one is
                         # nothing, because a pass that finishes early just exits.
MAX_PASSES=24            # ~3 passes expected per 800-game cell at these timeouts; 24
                         # bounds a pathological resume loop. Hard ceiling 24 x 2700 s.
CLAIM_STALE_SECS=2700    # ~28x one game's expected duration (~96 s local-equivalent)
VOID_RATE_ABORT_PCT=10   # LAUNCHER-SAFETY breaker, DISTINCT from READ_RULE.md SS3's
                         # G-N adjudication bar (<2%, decided after the fact).

# --- repo root / paths ---------------------------------------------------------
# ⭐ THE OUT-ROOT IS ON THE SHARE, NOT IN THE REPO, because the LOCAL box adjudicates
# over BOTH boxes' archives and can only see the laptop's cells if the laptop writes
# them to the share.
# ⚠️ THE MOUNT SPELLING DIFFERS BY BOX (CLAUDE.md): local /mnt/c/carc-shared, and
# anything running INSIDE the laptop /mnt/carc-shared. run_cells.sh picks the right one
# from --host and screen_lib.BOXES[role]["share_mount"].
REPO_LOCAL=/home/doctor/projects/carcassone
RUN_ID=invasion_screen_r3_20260827
OUT_LEAF=invasion_screen_r3_20260827
SHARE_LOCAL=/mnt/c/carc-shared
SHARE_LAPTOP=/mnt/carc-shared   # allow-path: the laptop-side spelling, used only under --host laptop

# --- the adjudicator + the shared bar library (READ_RULE.md SS7) ---------------
ADJUDICATOR=measurement/invasion_screen_r3_prep/analyze_screen.py
SCREEN_LIB=measurement/invasion_screen_r3_prep/screen_lib.py

# --- ⭐ ONE SS9 SMOKE PER BOX, each on its own disjoint throwaway sub-range -----
# A single-box round could smoke once. A TWO-box round cannot: each box has its own
# wheel install, its own repo checkout, its own share mount and its own W, and the SS9
# leg exists to prove the plumbing ON THE MACHINE THAT WILL SPEND THE DECKS.
#
# LAPTOP -> J_HIGH (⛔ THE LOAD-BEARING ONE). The laptop owns the A ladder AND both JOINT
#   cells, and the JOINT candidate leaf -- TWO invasion knobs on ONE leaf, a two-key leaf
#   diff, and the round's only adoption-chain-eligible novelty -- has NEVER emitted a
#   manifest on any box in any round. J_HIGH rather than J_LOW because it carries the
#   larger dose of both knobs.
# LOCAL  -> C_MID. The local box owns the three C cells, whose shape-B ENV regime round 2
#   proved end to end, so this leg re-confirms the launcher, the wheel install and the
#   env regime ON THIS BOX. C_MID rather than C_LOW/C_HIGH because the interior rung is
#   the one SS4.7's noise-signature rule reads.
#
# ⛔ Both ranges are DISJOINT from each other and from every cell; both are DISCARDED,
# never pooled, never claimed. The cells and seed starts are frozen in
# screen_lib.SMOKE_BY_BOX; the launcher reads them from there, not from here.
#
# ⛔ AND THE SMOKE RUNS AT THE BOX'S OWN FROZEN W -- there is no SMOKE_WORKERS this round.
# Round 2 smoked at a separate W=8; round 3 does not, because UNIFORMITY BEATS SPEED here:
# the leg's job is to prove the plumbing in the configuration that will spend the decks,
# W_LOCAL is an owner constraint rather than a free choice, and a 16-game leg does not
# saturate W either way -- so the cost of uniformity is ~nothing and the benefit is that
# the smoke cannot pass at a W the real cells never use.
SMOKE_GAMES=16
