# WORKERS.conf -- the ONE place per-box worker counts and run constants live for
# the CARCASUM ARBITER-TRANSFER CHALLENGE (measurement/carcasum_arb_challenge_prep/).
#
# Sourced at the top of run_cells.sh:  . "$(dirname "$0")/WORKERS.conf"
#
# TO CHANGE A CONSTANT, EDIT HERE AND NOTHING ELSE. No launcher hard-codes a value.
# THE PAIR IS LAW -- every constant below is read from DESIGN.md/READ_RULE.md; a
# launcher that disagrees with the pair is a launcher defect, the pair does not move.

# --- the blind commit every manifest must carry (READ_RULE.md preamble) ------
# A commit cannot name its own hash from inside itself -- stays PENDING at the
# freeze commit; a small FOLLOW-UP commit stamps the real sha before any real
# launch (71b3286c -> 7fd9c8de / e48d086e -> 314473ed precedent).
# AMENDMENT #1 (2026-08-24, band substitution 144e9 -> 147e9, zero games run):
# re-stamped to the AMENDMENT commit's own sha by the SAME follow-up-commit
# convention -- superseded once, 7cd3aafb -> PENDING (this edit) -> <amendment
# commit sha> (the next follow-up).
# HEALTHY RUN -> an 8..40 hex-char commit hash. FIRES (refuses launch) -> the
# literal string PENDING. --dry-run and the smoke (DESIGN.md SS9) are exempt.
BLIND_COMMIT=fa174be0

# --- worker count (single box; DESIGN.md SS6/SS7: concurrent-interleaved arms) --
# Both arms run SIMULTANEOUSLY, each on half the box's workers, for thermal/drift
# control (DESIGN.md SS6). Total wall-clock is the SAME as sequential-full-W --
# only the drift protection differs.
W_LAPTOP_TOTAL=14
W_PER_ARM=7            # W_LAPTOP_TOTAL / 2, one process per arm, concurrent
NICE=19                # house rule: long cluster workers yield to interactive use

# --- n (DESIGN.md SS3.2) -------------------------------------------------------
N_DECKS_PRIMARY=200     # 200 decks x 2 seats x 2 arms = 800 games primary
N_DECKS_TOPUP=50        # reserved, consumed ONCE if READ_RULE.md's top-up branch fires
N_COMMON_FLOOR=160      # READ_RULE.md SS3 G-N -- 80% of N_DECKS_PRIMARY

# --- the band (DESIGN.md SS4, AMENDED SS4.1) ------------------------------------
# ⚠️ AMENDMENT #1 (2026-08-24, zero games run): the original claim (144000000000)
# COLLIDED with an unmerged sibling branch's own claim (d2r2-freeze's
# measurement/track_d2r2_prep/, also 144000000000, claimed same-day) -- both
# claims were made against the checked-out repo's own governance/BAND_REGISTRY.csv,
# which is blind to claims committed on OTHER unmerged freeze branches. Caught by
# a pre-launch review BEFORE game 1, not by the (main-tree-scoped) registry check
# this pair's own build already ran twice. Fixed by an all-branches sweep
# (DESIGN.md SS4.1): band substituted 144000000000 -> 147000000000. See SS4.1 for
# the full finding and the corrected procedure for the NEXT claimer.
BAND=147000000000
SHARED_DECK_SEED_START=147000000000        # primary: ..000000199 (200 decks)
SHARED_DECK_SEED_END_PRIMARY=147000000199
SHARED_DECK_SEED_END_TOPUP=147000000249    # ..000000249 = +50 decks (topup)
BAND_SENTINEL=BAND_CLAIMED

# --- the opponent config held fixed across BOTH arms (DESIGN.md SS2) -----------
OPP_KIND=mcts
OPP_BUDGET_MS=5000       # TIME mode -- mIsTimeout=1, NOT playout mode
OPP_CP=0.5
OPP_UTILITY=portion
OPP_PLAYOUT_POLICY=random

RULES_PROFILE=fixed_v1

# --- ARM-OFF: production champion, no arbiter (DESIGN.md SS2) ------------------
ARM_OFF_NAME=arm_off
# no --champ-tiearb-* flags passed at all -- the harness default is disarmed

# --- ARM-ON: production champion + PRODUCTION.yaml root tie-arbiter ------------
ARM_ON_NAME=arm_on
TIEARB_B=64
TIEARB_J=4
TIEARB_MODE=argmax
TIEARB_SALT=tiearb2-deploy-v1
TIEARB_EPS=0.0
# TIEARB_THREADS: PRODUCTION.yaml's deployed value is 8, but this is NOT wired --
# verified during the build (DESIGN.md SS8) that make_production_champion's current
# signature has no `tiearb_threads` path, and neither jcz_match/match.py nor
# play_harness.py (the two existing tiearb-arming harnesses) wire it either. Runs
# SEQUENTIALLY (the rust default, threads=1) -- per PRODUCTION.yaml's own gate
# ("BIT-IDENTICAL by gate... NO strength claim owed"), this plays the IDENTICAL
# games a threads=8 run would; only wall-clock is affected (DESIGN.md SS7's
# projection is a floor, not a guarantee, because of this). No CLI flag exists for
# it -- run_cells.sh does not pass --champ-tiearb-threads.
TIEARB_THREADS_WIRED=false

# --- abort-to-partial (DESIGN.md SS7 wall-clock; 2x linear projection) ---------
# Primary: 800 games total, ~3.96h linear at W=14 combined (either split 7+7
# concurrent or sequential-full-14) -- 2x = ~7.92h combined budget, split evenly
# per arm at the per-arm game count (400 games/arm at n=200).
ARM_ABORT_SECS_PRIMARY=14251   # 2x (400 games x 249.7s / 7 workers)
ARM_ABORT_SECS_TOPUP=3563      # 2x (100 games x 249.7s / 7 workers), topup only

# --- void-rate circuit breaker (task brief SS4: ABORT >= 10%) ------------------
# Each arm runs in CHUNKS via --limit; after each chunk the launcher recomputes
# the cumulative void rate from that arm's own archive and aborts further chunks
# (does not kill an in-flight chunk) if the rate is >= this floor. Distinct from
# READ_RULE.md SS3.1's 1% FINAL read-out bar -- this is an early stop-wasting-
# compute breaker during the run itself.
VOID_RATE_ABORT_PCT=10
CHUNK_GAMES=40          # games per --limit chunk, per arm

# --- repo root -------------------------------------------------------------------
# Repo-relative output (measurement/), same as r1/rung2 -- no $SHARE mount, no
# cross-box worker split to coordinate for a single-box (laptop) run.
REPO_LOCAL=/home/doctor/projects/carcassone

# --- run identity ------------------------------------------------------------------
RUN_ID=carcasum_arb_challenge_20260824
OUT_SUBDIR=measurement/carcasum_arb_challenge_20260824

# --- the adjudicator (DESIGN.md SS7) ----------------------------------------------
ADJUDICATOR=scripts/carcasum_match/analyze_arb_challenge.py

# --- driver binary -----------------------------------------------------------------
# Default resolved by run_cells.sh via $CARCASUM_DRIVER or the standard vendored
# path; G-BINARY (READ_RULE.md SS3) checks cross-arm CONSISTENCY, not equality to
# a hardcoded constant, so no sha is pinned here -- pin it into the freeze commit's
# own note once the launch box is chosen (DESIGN.md SS4/SS7).
