# WORKERS.conf — the ONE place per-box worker counts live for the tie-arbiter
# WIDENING run (DESIGN §8, work item W10.1).
#
# Sourced at the top of every launcher and driver of this campaign:
#     . "$(dirname "$0")/WORKERS.conf"          # from this directory
#     . "$CAMPAIGN/WORKERS.conf"                # from scripts/tiletie/
#
# ⚠️ IT LIVES OUTSIDE `shared_run/` ON PURPOSE (DESIGN §9 item 9). `shared_run/`
# is the FROZEN blind prereg pair; this file is a TUNING surface. Keeping it out
# means a worker retune is never an edit to a frozen file. If it must be retuned
# mid-run, that is a NUMBERED §7 DEVIATION in the read-out, not a silent edit.
#
# ⚠️ TO CHANGE A WORKER COUNT, EDIT THE VALUE HERE AND NOTHING ELSE.
# No launcher and no driver hard-codes a count.

# --- worker counts: TWO SETS, NOT ONE ---------------------------------------- #
# The R1/R2 documents cite W48/W24 for GENERATION and W30/W22 for SCORING. A
# single `W_LOCAL` (the tiearb2_20260816 spelling) cannot express that and would
# silently GENERATE AT EVAL SPEED. Every launcher picks the set that matches its
# workload; nothing may hard-code a count or borrow the other set.
#
#   GEN  — `gen_fair_distill.py --backend rust` (rust playouts, F7d GEN row)
#   EVAL — the CPU-leaf scoring legs: run_census, champ_picks, build_positions,
#          run_tiletie / tier1_rust_leg (F7d eval row)
W_GEN_LOCAL=48        # F7d GEN row (gen_fair_distill --backend rust)
W_GEN_LAPTOP=24       # F7d GEN row
W_EVAL_LOCAL=30       # F7d eval row (CPU-leaf / scoring legs)
W_EVAL_LAPTOP=22      # F7d eval row

# --- niceness (house rule: all long cluster workers yield to interactive use) - #
NICE=19

# --- share paths (differ by box — the CLUSTER_OPS invariant) ------------------ #
# ⚠️ Local commands use /mnt/c/carc-shared; anything INSIDE an `ssh laptop` uses
# /mnt/carc-shared. A launcher resolves this from its own `{local|laptop-side}`
# argument and never guesses.
SHARE_LOCAL=/mnt/c/carc-shared
SHARE_REMOTE=/mnt/carc-shared

# --- repo roots --------------------------------------------------------------- #
REPO_LOCAL=/home/doctor/projects/carcassone
REPO_REMOTE=/home/doctor/projects/carcassone

# --- run identity -------------------------------------------------------------- #
RUN_ID=tiearb_widening_20260817
SHARE_RUN_LOCAL="$SHARE_LOCAL/$RUN_ID"
SHARE_RUN_REMOTE="$SHARE_REMOTE/$RUN_ID"
