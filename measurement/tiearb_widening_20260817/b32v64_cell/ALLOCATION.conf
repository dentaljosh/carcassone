# ALLOCATION.conf — the two-box split for the `B = 32` vs `B = 64` GAME cell.
#
# Sourced (advisory only) by `run_cells.sh` AFTER `WORKERS.conf`.
#
# =============================================================================
# ⛔⛔ READ THIS FIRST: THIS FILE CANNOT ENFORCE ANYTHING, AND IT SAYS SO.
# =============================================================================
# The campaign root's `ALLOCATION.conf` allocates STATIC per-chunk work because
# `scripts/tiletie/run_tiletie.py` has NO `--shared-claim` and no cross-box work
# stealing. `scripts/classical_search/eval_fair_puct.py` DOES
# (`--shared-claim` + `.claim` files on the share), so:
#
#   ⇒ THE SPLIT BETWEEN THE TWO BOXES IS **DYNAMIC** AND NO FILE CAN PIN IT.
#     Each box claims the next unclaimed (deck, seat) cell and the split falls
#     out of the boxes' realized throughput.
#
# THIS FILE IS THEREFORE A **SIZING AND EXPECTATION DOCUMENT**, not a control
# surface. It exists so the sizing assumptions are on the log and so a realized
# split that departs wildly from the expectation is legible as an anomaly.
# ⚠️ It is a DRAFTING DEFECT to cite this file as if it constrained the run.
# (Reported as spec-vs-buildable mismatch 5, DESIGN §13.2.)

# =============================================================================
# THE MEASURED ARITHMETIC — from the `b64_cell`'s OWN realized run, not a model
# =============================================================================
# SOURCE: /mnt/c/carc-shared/tiearb_widening_20260817_b64_cell/b64_*/
#         `*.claim` (carries `<claim-host-tag>:<pid>:<epoch>`, so every record's
#         BOX is recoverable) joined to its `seed*.json::elapsed_s`.
#         3,000 records, 100% attributed, 0 unparseable.
#
#   b64_cell REALIZED, WIDE cell (B=64):
#       laptop  876 games (58.4%)  mean elapsed  883.59 s/game
#       local   624 games (41.6%)  mean elapsed  990.40 s/game
#   b64_cell REALIZED, NARROW cell (B=16):
#       laptop  715 games (47.7%)  mean elapsed  400.15 s/game
#       local   785 games (52.3%)  mean elapsed  412.76 s/game
#
#   => per-box worker-seconds        local  942,026 s = 261.67 wh
#                                    laptop 1,060,132 s = 294.48 wh
#   => realized WALL SPAN (first -> last seed*.json mtime, both cells) = 15.64 h
#   => per-box EFFECTIVE workers     local  261.67 / 15.64 = 16.731  of 30 nominal
#                                    laptop 294.48 / 15.64 = 18.829  of 22 nominal
#   => POOL = 35.560 effective workers of 52 nominal   (derate 1.4623)
#
# ⭐⭐ TWO MEASURED FINDINGS THAT CONTRADICT THE INHERITED MODEL. Both are
#     REPORTED, and NEITHER changes a worker count — the owner pinned 30/22.
#
#  (1) ⛔ THE LAPTOP IS **NOT** 25% SLOWER PER WORKER ON THIS WORKLOAD.
#      `PLAN_B_gt_16.md`'s ~25% per-worker slowness (LAPTOP_RATE 0.75) was
#      measured on the OFFLINE SCORING layer (clair-puct legs), NOT on game
#      play. Measured here on GAME play the laptop is FASTER per worker:
#          laptop/local per-worker rate = 990.40/883.59 = 1.121  (WIDE)
#                                       = 412.76/400.15 = 1.032  (NARROW)
#      => the 46.5-effective-worker model (30 + 22x0.75) is WRONG in BOTH its
#         terms and happens to land 1.31x optimistic overall. It is recorded
#         below as HISTORY and is NOT used to size anything.
#
#  (2) ⚠️ THE LOCAL BOX IS THE UNDER-OCCUPIED ONE: 55.8% occupancy at W=30 vs
#      the laptop's 85.6% at W=22. W_LOCAL=30 delivered ~16.7 EFFECTIVE workers
#      on a 16C/32T box — consistent with CLAUDE.md's standing finding that this
#      workload is DRAM-latency-bound and "the W optimum stays ~14-16 regardless
#      of core count". ⇒ W_LOCAL=30 is very plausibly PAST THE KNEE.
#      ⛔ NOT CHANGED HERE. The owner pinned "local 30w. laptop 22w." verbatim
#      on 2026-08-20, and a drafter does not move an owner-set knob. The
#      committed wall (DESIGN §7.5) already prices the realized 35.560-worker
#      pool, so the projection is honest whatever the cause.
#      ⚠️ RECOMMENDATION FOR THE ORCHESTRATOR, NOT AN ACTION: if the owner wants
#      the 35.3 h shortened, the lever with evidence behind it is a W_LOCAL
#      re-bench (scripts/bench_workers.py) at the PRODUCTION knobs of this cell,
#      not more boxes and not a smaller n.

