# WORKERS.conf — the ONE place per-box worker counts and run constants live for
# the `B = 32` vs `B = 64` TIE-ARBITER LADDER GAME CELL (`b32v64_cell/`).
#
# Sourced at the top of every launcher in this directory:
#     . "$(dirname "$0")/WORKERS.conf"
#
# ⚠️ TO CHANGE A WORKER COUNT, EDIT THE VALUE HERE AND NOTHING ELSE. No launcher
# hard-codes a count; no script surgery is required. (House discipline, carried
# from `b64_cell/WORKERS.conf` and the campaign root's.)
#
# ⛔ THE PAIR IS LAW AND IT IS BLIND-COMMITTED. Every constant below is READ from
# `DESIGN.md` / `READ_RULE.md`; none is invented here. A launcher that disagrees
# with the pair is a LAUNCHER defect — the pair does not move.

# --- ⭐ THE `L-SATURATED` BAR — the ONE place its two constants live ----------
# READ_RULE §4's `EQUIV` predicate is READ FROM HERE by
# `scripts/tiletie/analyze_b32v64_cell.py`. Changing these two lines changes the
# adjudicator's behaviour with NO code edit; that is the whole point of the block
# and it is why they sit at the TOP of this file rather than buried in it.
#
#   TOLERANCE_PTS   the owner's tolerance in pts/game. +-15 elo / 16.1247 elo per
#                   pt/game = 0.9302 -> COMMITTED 0.93 (READ_RULE §2.1, §6.2).
#   EQUIV_SHAPE     `two_sided` -> fire iff |D| + 1.645*se_D <= TOLERANCE_PTS
#                                  (CI90(D) CONTAINED IN [-TOL, +TOL])
#                   `one_sided` -> fire iff UB95(D) = D + 1.645*se_D <= TOLERANCE_PTS
#                                  (NON-INFERIORITY on the ONE-SIDED 95% UPPER
#                                   BOUND ON THE COST)
#
# ⚠️ `1.645` IS THE SAME NUMBER DOING A DIFFERENT JOB in the two shapes: under
# `two_sided` it is the 90%-two-sided critical value; under `one_sided` it is
# `z_{0.95}`, the ONE-SIDED 95% critical value. The arithmetic is identical; the
# interpretation is not. ⛔ Under the ruled shape the read-out must say
# "one-sided 95% upper bound" and NEVER "90% CI" (READ_RULE §4).
#
# ⭐ OWNER RULING 2026-08-21: the bar is ONE-SIDED non-inferiority — the owner
# selected "One-sided +-15" from the option card. `one_sided` is the COMMITTED
# shape. ⚠️ A large-negative `D` is NOT read as an equivalence by accident:
# `L-REVERSED` (`z_D <= -2.0`) is branch #2 and pre-empts `L-SATURATED` (#4) by
# FIRST-MATCH-WINS, so non-inferiority can only fire where the reversal did not.
#
# ⛔ FAIL-CLOSED: the adjudicator REFUSES to run if either line is absent,
# unparseable, or names a shape outside {two_sided, one_sided}. There is no
# coerced default — a missing bar is a drafting defect, not a zero.
TOLERANCE_PTS=0.93
EQUIV_SHAPE=one_sided

# --- the blind commit every manifest must carry (READ_RULE §4.3 item 12) ------
# ⛔ FAIL-CLOSED LAUNCH GUARD, and state both values so nobody has to guess:
#   HEALTHY RUN  -> a 8..40 hex-char commit hash, written here by the EXECUTOR
#                   AFTER the orchestrator's blind commit of DESIGN.md +
#                   READ_RULE.md lands on `main`.
#   FIRES        -> the literal string `PENDING` (the drafted value).
# `run_cells.sh` REFUSES a non-dry, non-smoke launch while it reads `PENDING`.
# The smoke and `--dry-run` are deliberately exempt: both are counts-and-cost
# only and neither spends blindness (DESIGN §9.2).
BLIND_COMMIT=PENDING

# --- worker counts (OWNER-FUNDED 2026-08-20: "local 30w. laptop 22w. n1500") --
W_LOCAL=30      # 5900XT box (16C/32T)
W_LAPTOP=22     # laptop
# ⭐ DESIGN §9.1: the smoke runs at PRODUCTION knobs — only the game count differs.
W_SMOKE_LOCAL=30
W_SMOKE_LAPTOP=22

NICE=19         # house rule: long cluster workers yield to interactive use

# --- the two cells (DESIGN §2 — every knob but `B` is the DEPLOYED shape) -----
# ⭐ The DEPLOYED shape is `B` = 64 / `J` = 4 as of the 2026-08-20 fold
# (governance/PRODUCTION.yaml::deploy.tiearb, commit 2f1c8cff). CELL_B64 is
# therefore a fresh-band replicate of the INCUMBENT; CELL_B32 is the cheaper
# CANDIDATE. Both play the UNMODIFIED champion as opponent.
CELL_LO=B32
CELL_HI=B64
TIEARB_B_LO=32          # ⭐ the only difference between the cells
TIEARB_B_HI=64
TIEARB_J=4
TIEARB_MODE=argmax
TIEARB_SALT=tiearb2-deploy-v1
TIEARB_EPS=0.0

# --- production budget (DESIGN §2: k8x1376 = 11,008, exact-K 2) --------------
K_DETS=8
SIMS=1376
EXACT_K=2
RULES_PROFILE=fixed_v1
CHAMP_LEAF_HASH=a36d2e15a3b3d71d      # READ_RULE §3 G-J1, INVERTED gate

# --- n (READ_RULE §1: 1,500 DECKS x 2 seatings = 3,000 games per cell) -------
# ⚠️ NOTE THE UNIT CHANGE FROM `b64_cell`. There `n` = 1,500 GAMES = 750 decks;
# here the owner funded `n1500` DECKS = 3,000 games per cell, 6,000 games total.
N_GAMES=3000
N_DECKS=1500
# READ_RULE §3 G-N — the SAME 80% bar in two units (2,400 games IS 1,200 decks)
N_COMMON_FLOOR=1200
CELL_GAMES_FLOOR=2400

# --- the band (READ_RULE §3 G-BAND) ------------------------------------------
# Claimed 2026-08-20 from governance/BAND_REGISTRY.csv by
# scripts/classical_search/claim_next_band.py (registry high-water mark was
# 139000000000, which is RETIRED). Both cells draw 140000000000..140000001499,
# each deck played twice with seats swapped.
BAND=140000000000
BAND_SENTINEL=BAND_CLAIM.json

# --- the smoke (DESIGN §9) ---------------------------------------------------
N_SMOKE=24                     # §9.1, per cell
SMOKE_BAND=900000400000        # §9.1 throwaway; NEVER claimed in BAND_REGISTRY
SMOKE_BAND_TIER=throwaway      # §9.1 condition of acceptance
SMOKE_BAND_REGISTRY_CLAIMED=false
# §9.3's one-sided HALT bar: 1.50 x 928.025 = 1,392.04 worker-s/game (CELL_B64)
SMOKE_HALT_MULTIPLE=1.50
WORKER_S_COMMITTED_B64=928.025      # MEASURED, b64_cell WIDE, 1,500 games
WORKER_S_COMMITTED_B32=579.389      # DERIVED, DESIGN §7.2 (PROJECTED, graded NOWHERE)
SMOKE_HALT_BAR=1392.038             # = SMOKE_HALT_MULTIPLE x WORKER_S_COMMITTED_B64

