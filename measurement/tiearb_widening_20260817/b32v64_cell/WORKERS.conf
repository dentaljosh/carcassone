SHARE_LOCAL=/mnt/c/carc-shared
SHARE_REMOTE=/mnt/carc-shared

# --- repo root (same path on both boxes) -------------------------------------
REPO_LOCAL=/home/doctor/projects/carcassone
REPO_REMOTE=/home/doctor/projects/carcassone

# --- run identity ------------------------------------------------------------
RUN_ID=tiearb_widening_20260817_b32v64_cell
CELL_SUBDIR_LO=b32v64_B32J4_deploy11008
CELL_SUBDIR_HI=b32v64_B64J4_deploy11008

# --- the adjudicator (DESIGN §12.1 — VERB ENUMERATION) -----------------------
# ✅ BUILT 2026-08-21. Named here because a pair may not name a pass without
# naming its tool (DEVIATIONS D6.2). It is a LAUNCH PRECONDITION, not a rider,
# and `run_cells.sh` still refuses (exit 9) if it is ever absent.
ADJUDICATOR=scripts/tiletie/analyze_b32v64_cell.py

# --- the §9.3 HALT decision record (DESIGN §9.3.1) ---------------------------
# WRITER   `analyze_b32v64_cell.py smoke-check`  (halt is in its EXIT CONDITION)
# ENFORCER `run_cells.sh`  — REFUSES a real-cell launch while halt == true
# READER   `G-SMOKE`'s launched-anyway conjunct (halt AND game records exist)
# ⛔ THERE IS NO OVERRIDE FLAG. A HALT holds until the OWNER rules: stop, or
# re-fund at the realized cost (DESIGN §9.3). Neither is a launcher decision.
SMOKE_HALT_RECORD=SMOKE_HALT.json

# --- rust toolchain ----------------------------------------------------------
# ⛔ `unpinned` is the NORMAL production value and PASSES `G-TOOL` provided BOTH
# boxes emit it (READ_RULE §3 G-TOOL, b64_cell/DESIGN.md §13.1 — that campaign's
# THIRD unsatisfiable-gate catch). Set a real toolchain here ONLY as a
# launch-environment change; it is never a gate conjunct.
RUST_TOOLCHAIN=
