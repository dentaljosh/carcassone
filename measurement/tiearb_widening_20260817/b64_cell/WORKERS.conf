# WORKERS.conf — the ONE place per-box worker counts and run constants live for
# the `B = 64` GAME cell (`b64_cell/`).
#
# Sourced at the top of every launcher in this directory:
#     . "$(dirname "$0")/WORKERS.conf"
#
# ⚠️ TO CHANGE A WORKER COUNT, EDIT THE VALUE HERE AND NOTHING ELSE. No launcher
# hard-codes a count; no script surgery is required. (House discipline, carried
# from `tiearb2_stage2_20260817/WORKERS.conf` and the campaign root's.)
#
# ⛔ THE PAIR IS LAW AND IT IS BLIND-COMMITTED. Every constant below is READ from
# `DESIGN.md` / `READ_RULE.md` / `RULINGS_PREBLIND.md`; none is invented here. A
# launcher that disagrees with the pair is a LAUNCHER defect — the pair does not
# move (blind commit `ad089bda`).

# --- the blind commit every manifest must carry (READ_RULE §4.3 item 12) ------
BLIND_COMMIT=ad089bda

# --- worker counts (DESIGN §7.4's two-box wall: W_LOCAL 30 + W_LAPTOP 22 = 52) #
W_LOCAL=30      # 5900XT box (16C/32T)
W_LAPTOP=22     # laptop
# ⭐ §9.1: the smoke runs at PRODUCTION knobs — only the game count differs.
W_SMOKE_LOCAL=30
W_SMOKE_LAPTOP=22

NICE=19         # house rule: long cluster workers yield to interactive use

# --- the two cells (DESIGN §2 — every knob but `B` is the DEPLOYED shape) -----
CELL_WIDE=WIDE
CELL_NARROW=NARROW
TIEARB_B_WIDE=64        # ⭐ the only difference between the cells
TIEARB_B_NARROW=16
TIEARB_J=4
TIEARB_MODE=argmax
TIEARB_SALT=tiearb2-deploy-v1
TIEARB_EPS=0.0

# --- production budget (DESIGN §1.2: k8x1376 = 11,008, exact-K 2) ------------
K_DETS=8
SIMS=1376
EXACT_K=2
RULES_PROFILE=fixed_v1
CHAMP_LEAF_HASH=a36d2e15a3b3d71d      # READ_RULE §3 G-J1, INVERTED gate

# --- n (READ_RULE §1: 1,500 deck-paired games per cell = 750 decks) ----------
N_GAMES=1500
N_DECKS=750
# READ_RULE §3 G-N — the SAME 80% bar in two units
N_COMMON_FLOOR=600
CELL_GAMES_FLOOR=1200

# --- the smoke (DESIGN §9) ---------------------------------------------------
N_SMOKE=24                     # §9.1, per cell per box
SMOKE_BAND=900000300000        # §9.1 throwaway; NEVER claimed in BAND_REGISTRY
SMOKE_BAND_TIER=throwaway      # §9.1 condition of acceptance (R1 ruling 6)
SMOKE_BAND_REGISTRY_CLAIMED=false
# §9.3's one-sided HALT bar: 1.50 x 958.794 = 1,438.2 worker-s/game (WIDE)
SMOKE_HALT_MULTIPLE=1.50
WORKER_S_COMMITTED_WIDE=958.794
WORKER_S_COMMITTED_NARROW=429.612
SMOKE_HALT_BAR=1438.191        # = SMOKE_HALT_MULTIPLE x WORKER_S_COMMITTED_WIDE

# --- share paths (differ by box — the CLUSTER_OPS invariant) -----------------
SHARE_LOCAL=/mnt/c/carc-shared
SHARE_REMOTE=/mnt/carc-shared

# --- repo root (same path on both boxes) -------------------------------------
REPO_LOCAL=/home/doctor/projects/carcassone
REPO_REMOTE=/home/doctor/projects/carcassone

# --- run identity ------------------------------------------------------------
RUN_ID=tiearb_widening_20260817_b64_cell
CELL_SUBDIR_WIDE=b64_WIDE_B64J4_deploy11008
CELL_SUBDIR_NARROW=b64_NARROW_B16J4_deploy11008

# --- rust toolchain ----------------------------------------------------------
# ⛔ `unpinned` is the NORMAL production value and PASSES `G-TOOL` provided BOTH
# boxes emit it (READ_RULE §3 G-TOOL, DESIGN §13.1 — this campaign's THIRD
# unsatisfiable-gate catch). Set a real toolchain here ONLY as a launch-environment
# change; it is never a gate conjunct.
RUST_TOOLCHAIN=
