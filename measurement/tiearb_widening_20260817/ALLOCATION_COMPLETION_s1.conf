# ALLOCATION_COMPLETION_s1.conf — the SUPPLEMENTARY tranche's
# (box x judge x chunk) allocation, emitted by `stage_chunks.py completion`.
#
# ⚠️ SOURCE THIS *INSTEAD OF* ALLOCATION.conf for the supplementary legs, or
# pass the chunk numbers to run_scoring.sh directly — the ALLOC_* keys below
# use the SAME spelling and would otherwise be overridden by the committed
# tranche's values.
#
# ⚠️ THIS FILE CANNOT MOVE A VALUE. throughput ONLY — chunk MEMBERSHIP is fixed by the committed POSITION_ORDER.json and is identical for both judges. World and playout seeds are sha256(tag|rid|j|salt): no chunk, no box, no worker count and no M enters the derivation, so this split cannot move a value.
#
# --- THE ARITHMETIC -----------------------------------------------------
#   chunks 9..16  (8 chunks, 85,760 arm playouts)
#   IF  85,760 x c_IF  2.35 = 55.98 wh
#   ARB 85,760 x c_ARB 0.178232 = 4.25 wh
#   TRANCHE TOTAL = 60.23 wh
#
#   effective capacity: local W30.0 -> 30.0 | laptop W22.0 x 0.75 -> 16.5 | pool 46.5
#   => ideal makespan 1.3 h; local should take 64.5% of the worker-hours
#
#   local  : IF chunks 9 10 11 12 13 + ARB chunks 9 10 11 12 13 14 15 16 = 39.76 wh
#            -> 39.76 / 30.0 = 1.33 h
#   laptop : IF chunks 14 15 16 = 20.47 wh
#            -> 20.47 / 16.5 = 1.24 h
#   => TRANCHE MAKESPAN ~1.33 h (local share 66.0% vs the 64.5% ideal)
#
#   ⚠️ THE LAPTOP GETS NO ARB WORK — load balance, not capability, exactly
#   as in ALLOCATION.conf: ARB is a small share of the bill and far cheaper
#   per playout, so keeping it whole on one box removes a cross-box surface.

N_CHUNKS_COMPLETION_s1=8
COMPLETION_CHUNKS_s1="9 10 11 12 13 14 15 16"
LAPTOP_RATE=0.75

ALLOC_s1_local_tier1_greedy="9 10 11 12 13 14 15 16"
ALLOC_s1_local_clair_puct="9 10 11 12 13"
ALLOC_s1_laptop_side_tier1_greedy=""
ALLOC_s1_laptop_side_clair_puct="14 15 16"

JUDGE_ORDER="tier1-greedy clair-puct"
STRATUM_ORDER="s1"
