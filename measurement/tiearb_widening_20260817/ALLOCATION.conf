# ALLOCATION.conf — the ONE place the static (stratum x box x judge x chunk)
# allocation lives for the tie-arbiter WIDENING shared run.
# Sourced by run_scoring.sh AFTER WORKERS.conf.
#
# ⚠️ TO REBALANCE, EDIT THE `ALLOC_*` LINES HERE AND NOTHING ELSE.
# No launcher hard-codes a chunk list; no script surgery is required. (Same
# discipline as WORKERS.conf, which owns the worker counts.)
#
# ⚠️ THIS FILE CANNOT MOVE A VALUE. Chunk MEMBERSHIP is fixed by
# POSITION_ORDER.json and is IDENTICAL for both judges regardless of who runs
# which chunk. World/playout seeds are `sha256(tag|rid|j|salt)` — no chunk, no
# box, no worker count and no M enters the derivation
# (`oracle_score_pilot.world_seed` / `playout_seed`; `tier1_rust_leg` imports
# those very functions). So the frozen READ_RULE's `G-CRN` cross-judge join and
# the analyzer's per-position pairing on `rid` are indifferent to this file.
# It is throughput ONLY.
#
# --- WHY STATIC --------------------------------------------------------------
# `scripts/tiletie/run_tiletie.py` has NO `--shared-claim` and no cross-box work
# stealing — only `--resume`. The two boxes cannot steal from one queue, so the
# split is decided up front.
#
# --- WHY MATERIALIZED CHUNK DIRS ---------------------------------------------
# `run_tiletie.py` has NO `--rids-file` and no subset flag: the only handle on
# "which positions" is `--positions-dir`. Restriction is therefore materialized
# by `stage_chunks.py` as per-chunk positions dirs whose ARMS.json /
# POSITIONS_PLAN.json / leg jsonl are exact rid-subsets. `merge_legs.py`
# reassembles, with a per-rid completeness check.
#
# =============================================================================
# THE ARITHMETIC  (DESIGN §7's committed cost table; DESIGN §4's graded knobs)
# =============================================================================
#
#   committed worker-hours, scoring only (DESIGN §7):
#       S1 ARB  (tier1-greedy, rust)   891,993 playouts @ c=0.178232  =  44.2 wh
#       S1 IF   (clair-puct)           891,993 playouts @ c=2.35      = 582.3 wh
#       S2 ARB                         430,848 playouts @ c=0.178232  =  21.3 wh
#       S2 IF                          430,848 playouts @ c=2.35      = 281.2 wh
#       ------------------------------------------------------------------------
#       S1 total 626.5 wh    S2 total 302.5 wh    SCORING TOTAL 929.0 wh
#
#   EFFECTIVE capacity (PLAN_B's ~25% laptop per-worker slowness, priced in —
#   the brief's `30 : 22x0.75`):
#       local   W_EVAL_LOCAL  = 30   ->  30.0 effective
#       laptop  W_EVAL_LAPTOP = 22   ->  16.5 effective   (22 x 0.75)
#       pool                         =  46.5 effective
#       => ideal makespan 929.0 / 46.5 = 19.98 h
#       => local should take 30.0/46.5 = 64.5% of the worker-hours, laptop 35.5%
#
#   ⚠️ STRATA STAY SEQUENTIAL. DESIGN §9 item 10 is "THEN scoring: S1, then S2",
#   so this allocation splits EACH STRATUM across both boxes rather than giving
#   one stratum to each box. It costs nothing: the two strata have nearly the
#   same ARB:IF ratio, so the per-stratum optimum is the same split.
#
#   S1 (8 chunks; per chunk: IF 72.79 wh, ARB 5.53 wh)
#       local  : IF chunks 1-5 (363.9) + ARB chunks 1-8 (44.2) = 408.1 wh
#                -> 408.1 / 30   = 13.60 h
#       laptop : IF chunks 6-8 (218.4)                          = 218.4 wh
#                -> 218.4 / 16.5 = 13.24 h
#       => S1 makespan ~13.6 h        (local share 65.1% vs the 64.5% ideal)
#
#   S2 (8 chunks; per chunk: IF 35.15 wh, ARB 2.66 wh)
#       local  : IF chunks 1-5 (175.8) + ARB chunks 1-8 (21.3) = 197.1 wh
#                -> 197.1 / 30   =  6.57 h
#       laptop : IF chunks 6-8 (105.5)                          = 105.5 wh
#                -> 105.5 / 16.5 =  6.39 h
#       => S2 makespan ~6.6 h         (local share 65.2%)
#
#   TWO-BOX SCORING WALL  ~= 13.6 + 6.6 = ~20.2 h
#   (vs ~31 h single-box local-only: 929.0/30. DESIGN §7's "17.9 h parity" is the
#    52-nominal-worker figure that does NOT price the laptop's slowness.)
#
#   ⚠️ THE LAPTOP GETS NO ARB WORK — LOAD BALANCE, NOT CAPABILITY. The laptop
#   does have the rust wheel (verified for tiearb2_20260816). ARB is only 7% of
#   the bill and 12.2x cheaper per playout, so keeping it whole on one box costs
#   nothing and removes a cross-box surface. If you rebalance, the laptop CAN
#   take ARB chunks — chunk membership does not change.
#
#   ⚠️ THE `c` FIGURES ABOVE ARE THE COMMITTED ONES. DESIGN §7's binding,
#   ONE-SIDED c-remeasure (§9 step 4b-pre, four judge smokes at --smoke-n 20)
#   RE-MEASURES them BEFORE these legs start. If a realized `c` moves the
#   IF:ARB ratio materially, REVISIT THIS FILE BEFORE LAUNCH. Nothing about the
#   READ is affected.

# --- the chunk cut (must match stage_chunks.py's --chunks-s1/--chunks-s2) ----
N_CHUNKS_s1=8
N_CHUNKS_s2=8

# --- laptop per-worker rate relative to local (PLAN_B's ~25% slowness) -------
# Advisory: printed by run_scoring.sh so the sizing assumption is on the log.
LAPTOP_RATE=0.75

# --- (stratum, box, judge) -> chunk list -------------------------------------
# Key spelling: ALLOC_<stratum>_<box>_<judge> with '-' and '.' mapped to '_'.
ALLOC_s1_local_tier1_greedy="1 2 3 4 5 6 7 8"
ALLOC_s1_local_clair_puct="1 2 3 4 5"
ALLOC_s1_laptop_side_tier1_greedy=""
ALLOC_s1_laptop_side_clair_puct="6 7 8"

ALLOC_s2_local_tier1_greedy="1 2 3 4 5 6 7 8"
ALLOC_s2_local_clair_puct="1 2 3 4 5"
ALLOC_s2_laptop_side_tier1_greedy=""
ALLOC_s2_laptop_side_clair_puct="6 7 8"

# --- judge order within a stratum -------------------------------------------
# ARB first: it is the cheap rust leg (7% of the bill) and it is the ONLY leg
# any per-leg gate addresses (`resolved_config.*` / `preflight.seeds.*` exist
# only on tier1_rust_leg manifests — DESIGN §8 builder delta 4). Running it
# first puts the gate-addressed manifests on disk early.
JUDGE_ORDER="tier1-greedy clair-puct"

# --- stratum order ------------------------------------------------------------
# DESIGN §9 item 10: "THEN scoring: S1, then S2."
STRATUM_ORDER="s1 s2"

# --- the cost assumptions this allocation was sized against ------------------
C_ARB_ASSUMED=0.178232     # worker-s per playout, rust tier1 leg, `walled`
C_IF_ASSUMED=2.35          # worker-s per playout, clair-puct
C_REVISIT_TOLERANCE=0.25   # revisit this file if a remeasured c moves >25%
