# ALLOCATION_R5.conf — the ONE place the static (box x judge x chunk)
# allocation lives for rung3_r5's scoring pass.
# Sourced by run_scoring_r5.sh AFTER the campaign's WORKERS.conf.
#
# ⚠️ TO REBALANCE, EDIT THE `ALLOC_*` LINES HERE AND NOTHING ELSE.
# No launcher hard-codes a chunk list — same discipline as the parent
# campaign's ALLOCATION.conf, which this file is a sibling of (rung3_r5 has
# its own because the parent's `s2` slot now refuses loudly — see the parent
# ALLOCATION.conf's own comment, and PREREG_FAILURE_S2.md / commit 35a95408).
#
# --- WHY A SEPARATE FILE, NOT A NEW STRATUM IN THE PARENT ---------------------
# rung3_r5 is a SUCCESSOR PREREG, not a stratum of the R4.5 pair: its own
# blind commit (649c264f), its own corpus (`ARMS_R5.json`, 1,060 rids), its own
# staged layer (`STAGING_R5.json`, `G-STAGED`) and its own chunk tree
# (`rung3_r5/chunks/s2/chunk{1..8}` — named `s2` only because `stage_chunks.py`
# is REUSED verbatim and its stratum-keyed cost table (`M_BY_STRATUM`) hard-
# codes `s2 -> M=32`, which happens to be exactly R5's committed M; nothing
# else about the parent's `s2` — the VOIDED R4 S2 population — carries over).
# Folding this into the parent's ALLOCATION.conf would either (a) resurrect the
# poisoned `s2` slot, or (b) invent a stratum name `stage_chunks.py` does not
# know. A sibling file avoids both.
#
# =============================================================================
# THE ARITHMETIC (inherits DESIGN §7's cost model — c is UNCHANGED: same
# `walled` profile, same rust ARB backend, same `oracle_score_pilot` IF path,
# so no re-measurement is owed; only the position/pair COUNT is R5's own,
# read from the real `STAGING_R5.json` witness produced by `stage_r5_corpus.py`)
# =============================================================================
#
#   population: 6,602 (rid, leg) pairs across 12 legs — the drafter's PINNED
#   ladder (ruling 63ed329b), verified byte-for-byte against the real staged
#   corpus:
#       leg  1: 1060   leg  5: 866   leg  9: 171
#       leg  2: 1060   leg  6: 509   leg 10: 110
#       leg  3: 1060   leg  7: 366   leg 11:  66
#       leg  4: 1060   leg  8: 265   leg 12:   9
#       total = 6,602 pairs  =>  6,602 x 2 arms x 32 worlds = 422,528 playouts
#       (STAGING_R5.json::{leg_counts, n_total_pairs, expected_total_arm_playouts})
#
#   committed worker-hours, scoring only (c UNCHANGED from DESIGN §7):
#       R5 ARB (tier1-greedy, rust)  422,528 playouts @ c=0.178232  =  20.92 wh
#       R5 IF  (clair-puct)          422,528 playouts @ c=2.35      = 275.82 wh
#       ------------------------------------------------------------------------
#       SCORING TOTAL 296.74 wh
#
#   EFFECTIVE capacity (same PLAN_B ~25% laptop per-worker slowness the parent
#   campaign prices, brief's `30 : 22x0.75`):
#       local   W_EVAL_LOCAL  = 30   ->  30.0 effective
#       laptop  W_EVAL_LAPTOP = 22   ->  16.5 effective   (22 x 0.75)
#       pool                         =  46.5 effective
#       => ideal makespan 296.74 / 46.5 = 6.38 h
#       => local should take 30.0/46.5 = 64.5% of the worker-hours, laptop 35.5%
#
#   8 chunks (matching `stage_r5_corpus.py`'s `DEFAULT_N_CHUNKS_S2=8` / the
#   real `stage()` run); per chunk (equal-count planning split, ~825 pairs):
#       IF per chunk ~34.48 wh      ARB per chunk ~2.62 wh
#
#   SAME SPLIT SHAPE AS THE PARENT'S (R4) S2 ROW — it costs nothing here for
#   the same reason ALLOCATION.conf gives for R4: the ARB:IF ratio does not
#   move enough between chunks to change the per-stratum optimum.
#       local  : IF chunks 1-5 (172.4) + ARB chunks 1-8 (20.9) = 193.3 wh
#                -> 193.3 / 30   =  6.44 h
#       laptop : IF chunks 6-8 (103.4)                          = 103.4 wh
#                -> 103.4 / 16.5 =  6.27 h
#       => makespan ~6.44 h        (local share 65.1% vs the 64.5% ideal)
#
#   ⚠️ THE LAPTOP GETS NO ARB WORK — LOAD BALANCE, NOT CAPABILITY (same
#   reasoning as the parent: ARB is ~7% of the bill; keeping it whole on one
#   box costs nothing and removes a cross-box surface).
#
#   ⚠️ BOTH JUDGES ARE REQUIRED ON EVERY LEG, NOT S1-ONLY. rung3_r5 has no S1
#   analog to begin with (S1 is scored, unaffected, under the PARENT pair —
#   ADJUDICATION_R4_GATES.md RULING 1, "Reading A governs, S1 proceeds"); R5
#   is entirely the widened S2-successor population. Its estimand is carried
#   unchanged from R4 (DESIGN.md R5-7): "`Δ_ora`, `ora` adjudicates, `arb`
#   rides" — `ora` (clair-puct/IF) is what the branch table resolves against,
#   `arb` (tier1-greedy) rides alongside on every leg for the same reason it
#   rode on both R4 strata (it is the SUBJECT the campaign is testing: the tie-
#   arbiter's own picks, scored against the informed judge). Dropping ARB on
#   any leg would leave that leg's `arb` column unscored while the estimand
#   still needs it — there is no "IF-only" leg in this design.

# --- the chunk cut (must match the real `stage()` call's `n_chunks`) ---------
N_CHUNKS_s2=8

# --- laptop per-worker rate relative to local (PLAN_B's ~25% slowness) -------
# Advisory: printed by run_scoring_r5.sh so the sizing assumption is on the log.
LAPTOP_RATE=0.75

# --- (box, judge) -> chunk list ------------------------------------------------
# Key spelling: ALLOC_s2_<box>_<judge> with '-' and '.' mapped to '_' (the `s2`
# is the DIRECTORY name `stage_chunks.py` used, not a claim about strata — see
# the file header). All 8 chunks are allocated on BOTH judges — there is no
# "IF-only" or "ARB-only" leg in this design.
ALLOC_s2_local_tier1_greedy="1 2 3 4 5 6 7 8"
ALLOC_s2_local_clair_puct="1 2 3 4 5"
ALLOC_s2_laptop_side_tier1_greedy=""
ALLOC_s2_laptop_side_clair_puct="6 7 8"

# --- judge order ----------------------------------------------------------
# Same reasoning as the parent: ARB first, it is the cheap rust leg and the
# only leg any per-leg gate addresses (`resolved_config.*` / `preflight.
# seeds.*` live only on tier1_rust_leg manifests).
JUDGE_ORDER="tier1-greedy clair-puct"

# --- stratum order ----------------------------------------------------------
# ONE value: the directory `stage_chunks.py` wrote R5's chunks under (`s2`,
# per the file header). R5 has no second stratum to sequence against.
STRATUM_ORDER="s2"

# --- the cost assumptions this allocation was sized against ------------------
# INHERITED, not re-measured: same `walled` profile, same rust ARB backend,
# same `oracle_score_pilot` IF path as the parent campaign's committed c
# (DESIGN §7) — nothing about the per-playout cost model changed for R5, only
# the position count did.
C_ARB_ASSUMED=0.178232     # worker-s per playout, rust tier1 leg, `walled`
C_IF_ASSUMED=2.35          # worker-s per playout, clair-puct
C_REVISIT_TOLERANCE=0.25   # revisit this file if a remeasured c moves >25%
