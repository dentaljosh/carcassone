N_GAMES=800               # = DECKS x 2, per cell

# =============================================================================
# ⭐ THE RE-RUN'S BAND, AND THE BAND TAG THAT KEEPS IT OFF THE VOIDED RUN.
#
# The 2026-08-17 first run on band 133000000000 was VOIDED (DISCLOSURE.md §3:
# `G-TOOL` conjunct 2 — `our_git_rev` mixed within both cells because two
# docs-only commits landed mid-run). Its artifacts are the AUDIT TRAIL and are
# PRESERVED UNTOUCHED. Band 133000000000 is SPENT and retires from confirmatory
# use (DISCLOSURE §4.3); this re-run takes a FRESH band.
#
# BAND_TAG is stamped into EVERY artifact this run writes — shard, hostmap,
# merged cell, DONE/FAILED marker, log, chain script, smoke report — so the
# re-run CANNOT collide with, overwrite, append to, or be confused for the
# voided run's files. It is the collision guard, not decoration.
#
# BAND_FLOOR is the band this run EXPECTS to be allocated. `claim_next_band.py`
# has NO `--floor` flag (its `next_free_band(floor=...)` parameter is never
# wired to argparse, read 2026-08-17) — it always returns registry-high-water +
# 1e9. The registry high-water is 133000000000, so the allocation IS
# 134000000000. `claim_band.sh` therefore DRY-RUN PEEKS first and ABORTS if the
# claimer would hand back anything other than BAND_FLOOR, rather than passing a
# flag the claimer does not have. Fail-closed: a surprise band never gets played.
#
# ⚠️ BAND_SENTINEL IS A FRESH FILENAME. The retired 133000000000 sentinel
# (BAND_CLAIM.txt) still sits in this directory as part of the audit trail;
# reusing it would make claim_next_band.py memoize its way straight back onto
# the spent band. BAND_TAG must be defined ABOVE BAND_SENTINEL — adjudicate.py's
# WORKERS.conf parser expands `${VAR}` against keys ALREADY parsed, in file order.
# =============================================================================
BAND_TAG=b134
BAND_FLOOR=134000000000
BAND_SENTINEL="$RUN_DIR/BAND_CLAIM_${BAND_TAG}.txt"

# --- TWO-BOX EXECUTION: the static deck split (DESIGN §0.1) ------------------
# `scripts/jcz_match/match.py` has NO --shared-claim (checked, 2026-08-17), so
# the two boxes take DISJOINT, CONTIGUOUS deck ranges via --seed-base/--decks:
#     local  : --seed-base $BAND                       --decks $DECKS_LOCAL
#     laptop : --seed-base $((BAND + DECKS_LOCAL))     --decks $DECKS_LAPTOP
# with --champ-seat both on each, so the union covers all $DECKS decks x 2
# seatings EXACTLY ONCE per cell. A merge step verifies that exactly.
#
# ⭐⭐ THE SPLIT IS IDENTICAL ACROSS BOTH CELLS, AND THAT IS LOAD-BEARING, NOT
# TIDINESS. `D` is deck-paired: deck d contributes margin_B(d) - margin_A(d). If
# d ran on the laptop in one cell and on the local box in the other, ANY per-box
# difference (the JVM is 17.0.19+10-1-26.04.2 on the laptop vs -24.04.2 locally;
# contention differs; W differs) lands INSIDE the paired difference and is
# indistinguishable from the arbiter's effect. With the split identical, every
# per-box effect is common to both terms and CANCELS EXACTLY. READ_RULE `G-SPLIT`
# gates this from the records; it is not left to the launcher's good behaviour.
#
# The split is provisional until the smoke measures per-box s/game — the boxes
# are NOT equal-throughput (different W, different cores, different RAM), so
# splitting by W alone would leave one box idle at the end. Set from the smoke.
DECKS_LOCAL=215           # SET FROM THE SATURATING SMOKE (SPLIT_DERIVATION.txt)
DECKS_LAPTOP=185          # SET FROM THE SATURATING SMOKE; DECKS_LOCAL+DECKS_LAPTOP == DECKS
# Balanced so both boxes finish together: 2.50 h local / 2.49 h laptop.
# Derived from SATURATED worker-s/game (Doctor A 195.0 B 433.0; laptop A 155.5
# B 378.4), NOT from W and NOT from the undersaturated 4-deck smoke.

# --- rules (NOT negotiable; match.py raises if R9 is off) --------------------
RULES_PROFILE=fixed_v1
FIX_R9=1

