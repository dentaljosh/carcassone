# WORKERS.conf — the ONE place per-box worker counts and run constants live for
# jcz_tiearb_20260817 (the out-of-lineage pricing of the tie arbiter through JCZ).
#
# Sourced at the top of every launcher in this directory:
#     . "$(dirname "$0")/WORKERS.conf"
#
# ⚠️ TO CHANGE A WORKER COUNT, EDIT THE VALUE HERE AND NOTHING ELSE.
# No launcher hard-codes a worker count; no script surgery is required.

# --- worker counts -----------------------------------------------------------
# SINGLE BOX. DESIGN §6.3: `ssh laptop-wsl` has no JVM (`java: command not found`)
# and no Engine.jar, and JCZ is a Java program — the harness spawns one JVM per
# worker. The laptop is DECLINED for this run, not forgotten.
#
# W_LOCAL: the 2026-08-09 confirm ran W14 and loaded ~15 of 32 threads — the box
# was HALF IDLE, because a worker is one python thread plus a JVM that is busy
# 38 ms per move. W24 is the PROPOSED setting and is NOT extrapolated: the smoke
# measures per-worker RSS and throughput at W24 before the long run commits
# (bench-then-extrapolate-then-commit; `feedback_worker_count_by_bottleneck`).
W_LOCAL=24
W_SMOKE=24      # the smoke runs at the PRODUCTION worker count, not a cheaper one

# --- share paths (differ by box — the CLUSTER_OPS invariant) -----------------
SHARE_LOCAL=/mnt/c/carc-shared
SHARE_REMOTE=/mnt/carc-shared

# --- repo root ---------------------------------------------------------------
REPO_LOCAL=/home/doctor/projects/carcassone

# --- run identity ------------------------------------------------------------
RUN_ID=jcz_tiearb_20260817
RUN_DIR="$REPO_LOCAL/measurement/$RUN_ID"
SHARE_RUN_LOCAL="$SHARE_LOCAL/$RUN_ID"

# --- the two cells (DESIGN §3). Same band, same decks, six arguments apart. ---
CELL_A=jcz_CHAMP_deploy11008          # the UNMODIFIED champion vs JCZ
CELL_B=jcz_ARB_B16J4_deploy11008      # champion + the tie arbiter vs JCZ

# --- the funded arbiter rung (DESIGN §3; READ_RULE G-ARB voids on any other) --
# Identical to the rung Stage 2 confirmed. ⛔ READ_RULE §0.A anti-gaming clause:
# B stays 16 and may not be expanded; the tie predicate is not narrowed; there is
# no playout truncation for cost reasons.
TIEARB_B=16
TIEARB_J=4
TIEARB_MODE=argmax
TIEARB_SALT=tiearb2-deploy-v1
TIEARB_EPS=0.0

# --- the champion of record --------------------------------------------------
CHAMP_LEAF_HASH=a36d2e15a3b3d71d
K_DETS=8
SIMS=1376
EXACT_K=2

# --- the deck set (DESIGN §5) ------------------------------------------------
# Band claimed by claim_next_band.py IMMEDIATELY BEFORE game 1, memoized in
# BAND_CLAIM.txt for idempotent resume. Registry high-water at design time was
# 132000000000, so the expected allocation is 133000000000.
DECKS=400                 # decks per cell; each played twice, seats swapped
N_GAMES=800               # = DECKS x 2, per cell
BAND_SENTINEL="$RUN_DIR/BAND_CLAIM.txt"

# --- rules (NOT negotiable; match.py raises if R9 is off) --------------------
RULES_PROFILE=fixed_v1
FIX_R9=1

# --- JCZ provenance (DESIGN §7.1; READ_RULE G-JCZ) ---------------------------
JCZ_REV=29a156154c75ad7bf5a3af6e2e5db3eaeb1af76a
JCZ_JAR=/home/doctor/jcz_spike/JCloisterZone/build/Engine.jar
JCZ_JAR_SHA256=4dc5439dbf228b1360b0b1987f5e90454c4a6ac434a8509be4d2c089f9671190
JCZ_AI_CLASS=com.jcloisterzone.ai.AiEngine
JCZ_TILES=basic:2

# --- toolchain ---------------------------------------------------------------
RUST_TOOLCHAIN=1.96.0

# --- niceness (house rule: all long cluster workers yield to interactive use) -
NICE=19
