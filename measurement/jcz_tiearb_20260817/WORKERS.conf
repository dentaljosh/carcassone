# WORKERS.conf — the ONE place per-box worker counts and run constants live for
# jcz_tiearb_20260817 (the out-of-lineage pricing of the tie arbiter through JCZ).
#
# Sourced at the top of every launcher in this directory:
#     . "$(dirname "$0")/WORKERS.conf"
#
# ⚠️ TO CHANGE A WORKER COUNT, EDIT THE VALUE HERE AND NOTHING ELSE.
# No launcher hard-codes a worker count; no script surgery is required.

# --- worker counts -----------------------------------------------------------
# TWO BOXES, by OWNER DIRECTIVE 2026-08-17, verbatim: "make sure its both boxes,
# w22 and w30 respectively". This OVERRIDES the single-box deviation recorded in
# the first draft of DESIGN §6.3; see DESIGN §0.1 (pre-launch amendment).
#
# The JVM gap that motivated the single-box draft is SOLVED, not worked around:
# openjdk-17-jre-headless installed on the laptop from apt, /usr/bin/java verified
# in a NON-INTERACTIVE ssh shell, Engine.jar staged via the share and sha256-verified
# against the pin per host, and the AI shim classes COPIED (not rebuilt) so both
# hosts run byte-identical bytecode — stronger provenance than two javac runs.
W_LOCAL=30      # 5900XT box (16C/32T), 41 GB. Owner-set.
W_LAPTOP=22     # laptop (24T, 11 GB). Owner-set.
W_SMOKE_LOCAL=30    # the smoke runs at the PRODUCTION worker count, not a cheaper one
W_SMOKE_LAPTOP=22

# ⚠️ THE LAPTOP MEMORY RISK, NAMED BEFORE THE SMOKE. The laptop has 11 GB and
# W22 means 22 python+rust workers AND 22 JVMs. A WSL guest that balloons past
# the .wslconfig cap is TORN DOWN by Windows, killing the whole leg
# (`reference_wsl2_host_memory_teardown`). Two mitigations, both applied
# IDENTICALLY on BOTH boxes and BOTH cells so they can never become a box or a
# cell confound:
#   (1) JVM_OPTS below caps each JVM's heap and forces a single-threaded GC —
#       default G1 spawns GC threads per core, so 22 JVMs x N GC threads is a
#       thread explosion on a 24T box.
#   (2) the smoke MEASURES per-worker RSS at the production W on each box before
#       the long run commits (bench-then-extrapolate-then-commit).
# If the smoke shows W22 does not fit in 11 GB, that is REPORTED TO THE OWNER,
# not silently reduced — W22 is an owner-set value.
#
# JVM_OPTS is exported as _JAVA_OPTIONS (honoured by the JVM globally; its
# "Picked up" banner goes to STDERR and so cannot corrupt JCZ's stdout line-JSON
# protocol). Heap size and GC policy cannot change LegacyRanking's deterministic
# arithmetic, so this does not change JCZ's play.
JVM_OPTS="-Xmx256m -Xss1m -XX:+UseSerialGC -XX:TieredStopAtLevel=1"

# --- share paths (differ by box — the CLUSTER_OPS invariant) -----------------
SHARE_LOCAL=/mnt/c/carc-shared
SHARE_REMOTE=/mnt/carc-shared

# --- repo root (same path on both boxes) -------------------------------------
REPO_LOCAL=/home/doctor/projects/carcassone
REPO_REMOTE=/home/doctor/projects/carcassone
LAPTOP_HOST=laptop-wsl
JAVA_BIN=/usr/bin/java   # absolute: PATH is not guaranteed in the worker's shell class

# --- run identity ------------------------------------------------------------
RUN_ID=jcz_tiearb_20260817
RUN_DIR="$REPO_LOCAL/measurement/$RUN_ID"
SHARE_RUN_LOCAL="$SHARE_LOCAL/$RUN_ID"

# --- the two cells (DESIGN §3). Same band, same decks, six arguments apart. ---
CELL_A=jcz_CHAMP_deploy11008          # the UNMODIFIED champion vs JCZ
CELL_B=jcz_ARB_B16J4_deploy11008      # champion + the tie arbiter vs JCZ

# --- the funded arbiter rung (DESIGN §3; READ_RULE G-ARB voids on any other) --
# Identical to the rung Stage 2 confirmed. ⛔ READ_RULE §0.A anti-gaming clause:
# B stays 16 and may not be expanded; the tie predicate is not narrowed; there is
# no playout truncation for cost reasons.
TIEARB_B=16
TIEARB_J=4
TIEARB_MODE=argmax
TIEARB_SALT=tiearb2-deploy-v1
TIEARB_EPS=0.0

# --- the champion of record --------------------------------------------------
CHAMP_LEAF_HASH=a36d2e15a3b3d71d
K_DETS=8
SIMS=1376
EXACT_K=2

# --- the deck set (DESIGN §5) ------------------------------------------------
# Band claimed by claim_next_band.py IMMEDIATELY BEFORE game 1, memoized in
# BAND_CLAIM.txt for idempotent resume. Registry high-water at design time was
# 132000000000, so the expected allocation is 133000000000.
DECKS=400                 # decks per cell; each played twice, seats swapped
N_GAMES=800               # = DECKS x 2, per cell
BAND_SENTINEL="$RUN_DIR/BAND_CLAIM.txt"

# --- TWO-BOX EXECUTION: the static deck split (DESIGN §0.1) ------------------
# `scripts/jcz_match/match.py` has NO --shared-claim (checked, 2026-08-17), so
# the two boxes take DISJOINT, CONTIGUOUS deck ranges via --seed-base/--decks:
#     local  : --seed-base $BAND                       --decks $DECKS_LOCAL
#     laptop : --seed-base $((BAND + DECKS_LOCAL))     --decks $DECKS_LAPTOP
# with --champ-seat both on each, so the union covers all $DECKS decks x 2
# seatings EXACTLY ONCE per cell. A merge step verifies that exactly.
#
# ⭐⭐ THE SPLIT IS IDENTICAL ACROSS BOTH CELLS, AND THAT IS LOAD-BEARING, NOT
# TIDINESS. `D` is deck-paired: deck d contributes margin_B(d) - margin_A(d). If
# d ran on the laptop in one cell and on the local box in the other, ANY per-box
# difference (the JVM is 17.0.19+10-1-26.04.2 on the laptop vs -24.04.2 locally;
# contention differs; W differs) lands INSIDE the paired difference and is
# indistinguishable from the arbiter's effect. With the split identical, every
# per-box effect is common to both terms and CANCELS EXACTLY. READ_RULE `G-SPLIT`
# gates this from the records; it is not left to the launcher's good behaviour.
#
# The split is provisional until the smoke measures per-box s/game — the boxes
# are NOT equal-throughput (different W, different cores, different RAM), so
# splitting by W alone would leave one box idle at the end. Set from the smoke.
DECKS_LOCAL=240           # provisional, pending the smoke's per-box s/game
DECKS_LAPTOP=160          # provisional; DECKS_LOCAL + DECKS_LAPTOP must == DECKS

# --- rules (NOT negotiable; match.py raises if R9 is off) --------------------
RULES_PROFILE=fixed_v1
FIX_R9=1

