name: build-cloud-image

# Builds ghcr.io/dentaljosh/carcassone-cloud:tag and pushes to GitHub
# Container Registry. Used as --image for vast.ai cloud rentals so fresh
# boxes do not have to redownload 5 GB of PyTorch wheels.
#
# Triggers:
# - Manual via workflow_dispatch
# - Push to gpu-orchestrator branch (Dockerfile/requirements/workflow changes only)
#
# Setup: ZERO manual config required. Auth uses the GITHUB_TOKEN that GH
# Actions auto-provides. The first push will publish a PRIVATE image; make
# it public via the package page (repo -> Packages -> carcassone-cloud ->
# Package settings -> Change visibility -> Public) so vast.ai can pull it
# without credentials.
#
# This workflow does not consume any user-controlled inputs and only uses
# the safe github.repository_owner / github.sha / secrets.GITHUB_TOKEN
# contexts, so injection is not a concern.

on:
  workflow_dispatch:
  push:
    branches:
      - gpu-orchestrator
    paths:
      - Dockerfile
      - requirements.txt
      - .github/workflows/build-cloud-image.yml

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute lowercase image name
        id: img
        env:
          OWNER: ${{ github.repository_owner }}
        run: echo "name=ghcr.io/${OWNER,,}/carcassone-cloud" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        env:
          IMG: ${{ steps.img.outputs.name }}
          SHA: ${{ github.sha }}
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMG }}:latest
            ${{ env.IMG }}:sha-${{ env.SHA }}
          cache-from: type=registry,ref=${{ env.IMG }}:buildcache
          cache-to: type=registry,ref=${{ env.IMG }}:buildcache,mode=max
