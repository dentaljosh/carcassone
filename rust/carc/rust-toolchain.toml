[toolchain]
# Pinned to the stable that P0 was developed and gated on (2026-07-31).
# Bumping this invalidates the G0 bit-exactness evidence -> re-run
# scripts/rustport/reconcile_*.py before adopting a new toolchain.
channel = "1.96.0"
components = ["rustfmt", "clippy"]
# Android targets for P7 (android/tools/build_rust_wheels.py). They do NOT need
# to be installed for host-side builds; rustup will fetch them on demand.
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-linux-android",
    "x86_64-linux-android",
]
profile = "minimal"
